<style>
:root{--verde:#0B6B50;--verde2:#E8F3EF;--txt:#111827;--sub:#4B5563;--borda:#E5E7EB;--fundo:#F4F5F7;--erro:#B42318;--erro2:#FDECEA;--aviso:#7A3E06;--aviso2:#FFF7E6}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,sans-serif;color:var(--txt);background:var(--fundo)}
.wrap{max-width:1200px;margin:0 auto;padding:24px 16px 64px;display:flex;flex-direction:column;gap:20px}
h1{margin:0;font-family:'Space Grotesk',Inter,sans-serif;font-size:32px;letter-spacing:-.02em}

.sub{color:var(--sub);font-size:14px}
nav{display:flex;flex-wrap:wrap;gap:6px;background:#fff;border:1px solid var(--borda);border-radius:12px;padding:6px;position:sticky;top:8px;z-index:5}

button:focus-visible,a:focus-visible{outline:2px solid var(--verde);outline-offset:2px}
.card{background:#fff;border:1px solid var(--borda);border-radius:14px;padding:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.stat{background:#F9FAFB;border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:2px}

.decisao b{font-family:'Space Grotesk',Inter,sans-serif;font-size:30px}

th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--sub);font-weight:600;padding:8px 6px;border-bottom:1px solid var(--borda)}
td{padding:8px 6px;border-bottom:1px solid #F1F2F4;vertical-align:middle}
.rolagem{overflow-x:auto}
.ok{color:var(--verde);font-weight:700}.no{color:var(--erro);font-weight:700}.wait{color:var(--sub)}
.marca{display:inline-flex;gap:3px}
.marca i{font-style:normal;display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:5px;font-size:12px;font-weight:700;background:#F1F2F4;color:#9CA3AF}
.marca i.on{background:var(--verde);color:#fff}
.marca i.res{outline:2px solid var(--erro);color:var(--erro);background:#fff}
.marca i.on.res{outline:2px solid #111827;background:var(--verde);color:#fff}
.barra{display:flex;height:20px;border-radius:5px;overflow:hidden;font-size:11px;font-weight:600;min-width:150px}
.barra span{display:flex;align-items:center;justify-content:center;color:#fff}
.chip{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600}
.alerta{background:var(--aviso2);color:var(--aviso);border-radius:8px;padding:6px 10px;font-size:13px;margin-top:4px}
.licao{background:var(--aviso2);border:1px solid #F3D9A4;border-radius:10px;padding:10px 14px;font-size:14px;color:#3B2A12}
tr.linha{cursor:pointer}tr.linha:hover{background:#F9FAFB}
.vol td{padding:4px 3px;text-align:center}
.vol td.d{background:var(--verde);color:#fff;font-weight:700;border-radius:4px}
.ao{display:inline-flex;align-items:center;gap:6px}.ao::before{content:"";width:8px;height:8px;border-radius:50%;background:#DC2626}
[hidden]{display:none!important}
.btn{min-height:44px;padding:8px 14px;border-radius:8px;border:1px solid #D1D5DB;background:#fff;font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.btn.pri{background:var(--verde);color:#fff;border:0}
.tg{min-width:40px;min-height:40px;border-radius:8px;font:inherit;font-weight:700;cursor:pointer;background:#fff;color:#6B7280;border:1px solid #D1D5DB}
.tg.on{background:var(--verde);color:#fff;border:0}
.graf{position:relative;height:300px}
.vols{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.volante{border:2px solid #B42318;border-radius:10px;padding:10px;background:#FFFDF8;break-inside:avoid}
.volante h4{margin:0 0 6px;font-size:13px;color:#B42318;display:flex;justify-content:space-between}
.volante table{font-size:12px}.volante td{padding:2px 3px;border:0}
.cx{display:inline-block;width:22px;height:16px;border:1.5px solid #B42318;border-radius:3px;text-align:center;font-size:10px;line-height:14px;color:#B42318}
.cx.m{background:#111827;border-color:#111827;color:#fff}
.barraf{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
select.sel{min-height:44px;padding:8px 12px;border:1px solid #D1D5DB;border-radius:8px;font:inherit;font-size:15px;background:#fff}
.termo{border:2px solid #A7F3D0}.tbar{position:relative;height:14px;border-radius:9px;background:linear-gradient(90deg,#E5E7EB,#FDE68A,#6EE7B7);margin-top:10px;display:flex;justify-content:space-between;font-size:10px;color:#6B7280;padding:0 6px;align-items:center}.tbar i{position:absolute;top:-4px;width:6px;height:22px;background:#111827;border-radius:3px;margin-left:-3px}
.jpcard{background:linear-gradient(135deg,#ECFDF5,#F0FDF9);border:1px solid #A7F3D0;border-radius:14px;padding:12px 14px;margin-bottom:16px;display:flex;flex-direction:column;gap:10px}
.jpk{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.jpk span{background:#fff;border-radius:10px;padding:6px 8px;font-size:11px;color:#6B7280;display:flex;flex-direction:column}.jpk b{font-family:'Space Grotesk',Inter,sans-serif;font-size:17px;color:#0B6B50}
.jpmini{display:flex;flex-wrap:wrap;gap:4px}.jpm{display:inline-flex;flex-direction:column;align-items:center;min-width:34px;padding:3px 4px;border-radius:7px;background:#fff;border:1px solid #D1FAE5;font-size:10px;color:#6B7280}.jpm b{font-size:12px;color:#111827}.jpm.D{background:#FEF3C7;border-color:#FDE68A}.jpm.T{background:#FEE2E2;border-color:#FECACA}
@media (max-width:520px){.jpk{grid-template-columns:repeat(2,1fr)}}
.vtopo{padding:12px 16px}.lb{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px}
.vgrid{display:grid;grid-template-columns:minmax(0,560px) minmax(0,1fr);gap:20px;align-items:start}
.vcard{background:#FFFDF8;border:2px solid #B42318;border-radius:16px;overflow:hidden;box-shadow:0 8px 24px rgba(180,35,24,.08)}
.vhead{background:#B42318;color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
.vhead b{font-family:'Space Grotesk',Inter,sans-serif;font-size:22px;letter-spacing:.08em;margin-right:10px}.vhead span{font-size:13px;opacity:.9}
.vsum{display:flex;gap:6px}.vsum span{background:rgba(255,255,255,.18);border-radius:999px;padding:2px 10px;font-weight:700;font-size:13px}
.vcols,.vrow{display:grid;grid-template-columns:26px minmax(0,1fr) 54px 54px 54px minmax(0,1fr) 22px;gap:6px;align-items:center;padding:0 12px}
.vcols{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:#B42318;font-weight:700;padding-top:10px;padding-bottom:4px}.vcols span:nth-child(n+3):nth-child(-n+5){text-align:center}
.vcols span:nth-child(6){text-align:left}.vcols span:nth-child(2){text-align:right}
.vrow{padding-top:4px;padding-bottom:4px;border-top:1px dashed #F1C7C2}.vrow:hover{background:#FFF4E5}
.vrow.acertou{background:#ECFDF5}.vrow.errou{background:#FEF2F2}
.vn{font-weight:700;color:#B42318;font-size:13px}.vt{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.vt.m{text-align:right}
.vbx{height:44px;border:2px solid #B42318;border-radius:8px;background:#fff;color:#B42318;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;font:inherit;padding:0}
.vbx b{font-size:15px}.vbx small{font-size:10px;margin-top:2px;opacity:.8}.vbx:hover{background:#FFF1EE}
.vbx.on{background:#111827;border-color:#111827;color:#fff}.vbx.res{box-shadow:0 0 0 3px #16A34A}
.vtp{font-size:11px;font-weight:800;text-align:center;border-radius:5px}.vtp.D{background:#FEF3C7;color:#92400E}.vtp.T{background:#FEE2E2;color:#B42318}.vtp.S{color:#9CA3AF}
.vfoot{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px;padding:12px;border-top:2px solid #B42318;margin-top:6px}
.vk{background:#fff;border:1px solid #F1C7C2;border-radius:10px;padding:8px;text-align:center}.vk span{display:block;font-size:11px;color:#6B7280;text-transform:uppercase}.vk b{font-family:'Space Grotesk',Inter,sans-serif;font-size:19px}
.vaviso{margin:0 12px 10px;padding:8px 12px;border-radius:10px;font-size:14px;background:#F3F4F6;color:#374151}.vaviso:empty{display:none}
.vaviso.ok{background:#ECFDF5;color:#065F46}.vaviso.er{background:#FEF2F2;color:#991B1B}.vaviso.info{background:#EFF6FF;color:#1E40AF}
.vbt{padding:0 12px 14px}
.vpanel h2{margin-bottom:8px}.vmodos{display:grid;gap:8px;margin-bottom:12px}
.vmodo{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:2px solid var(--borda);background:#fff;border-radius:12px;padding:10px 14px;cursor:pointer;font:inherit}
.vmodo b{font-size:15px}.vmodo span{font-size:13px;color:var(--sub)}.vmodo.on{border-color:var(--verde);background:var(--verde2)}
.btn.big{font-size:16px;padding:10px 26px}.btn:disabled{opacity:.45;cursor:default}
#vlvols{margin-top:4px}
@media (min-width:981px){.vpanel{position:sticky;top:84px}}
@media (max-width:980px){.vgrid{grid-template-columns:1fr}}
@media (max-width:700px){nav{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}nav button{white-space:nowrap;flex:none}.vhead b{font-size:18px}.vsum span{padding:2px 7px;font-size:12px}.vhead{flex-wrap:wrap;gap:6px}}
@media (max-width:520px){.vcols,.vrow{grid-template-columns:22px minmax(0,1fr) 44px 44px 44px minmax(0,1fr);gap:4px;padding:0 8px}.vtp,.vcols span:last-child{display:none}.vt{font-size:12px}.vbx{height:42px}}
@media print{body{background:#fff}nav,header,.noprint,.aba:not(.imprimir){display:none!important}.imprimir{display:block!important}.card{border:0;padding:0}.vols{grid-template-columns:repeat(3,1fr)}}
@media (max-width:900px){.ap-grid{grid-template-columns:1fr!important}}
@media (max-width:640px){h1{font-size:24px}.stat b{font-size:22px}}
</style>
<style>
/* ---------- identidade 2026-11: sobria, mesa de jogo, numeros em destaque ---------- */
:root{--papel:#F4F5F3;--tinta:#16202A;--grafite:#58626B;--linha:#DCE0E2;--mesa:#1E5B48;--mesa2:#E5EEEA;--baixa:#9C3A2C;--baixa2:#F5E6E2;--ouro:#9A7A35;--ouro2:#F4EEDF;
  --verde:var(--mesa);--verde2:var(--mesa2);--txt:var(--tinta);--sub:var(--grafite);--borda:var(--linha);--fundo:var(--papel);--erro:var(--baixa);--erro2:var(--baixa2)}
body{font-family:'IBM Plex Sans',system-ui,sans-serif;background:var(--papel);color:var(--tinta);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,.stat b,.decisao b,.vhead b{font-family:'IBM Plex Sans',system-ui,sans-serif}
h2{font-size:18px;font-weight:600;letter-spacing:-.005em}
.wrap{max-width:1120px;gap:18px;padding-top:0}
th{text-transform:none;letter-spacing:0;font-size:13px;color:var(--grafite);font-weight:500}
.card{border-radius:10px;border-color:var(--linha);padding:20px}
.stat{background:#fff;border:1px solid var(--linha);border-radius:8px}
.btn{border-radius:7px;border-color:#C9CED2;color:var(--tinta)}
.btn.pri{background:var(--mesa)}
.btn:hover{border-color:var(--tinta)}.btn.pri:hover{background:#174A3A}
.num,.stat b{font-variant-numeric:tabular-nums}
/* topo */
.topo{position:sticky;top:0;z-index:20;background:rgba(244,245,243,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--linha);margin:0 -16px;padding:12px 16px 0}
.marca-app{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;padding-bottom:8px}
.logo{font-family:'IBM Plex Sans Condensed',sans-serif;font-weight:700;font-size:21px;letter-spacing:-.01em}
nav.principal{all:unset;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.principal button{all:unset;cursor:pointer;padding:10px 14px 12px;font-weight:500;color:var(--grafite);border-bottom:2px solid transparent;white-space:nowrap;font-size:15px}
nav.principal button:hover{color:var(--tinta)}
nav.principal button[aria-selected=true]{color:var(--tinta);border-bottom-color:var(--tinta);font-weight:600}
nav.principal button:focus-visible,nav.secundaria button:focus-visible{outline:2px solid var(--mesa);outline-offset:-2px}
nav.secundaria{all:unset;display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
nav.secundaria button{all:unset;cursor:pointer;padding:7px 12px;border-radius:999px;border:1px solid var(--linha);background:#fff;font-size:14px;color:var(--grafite)}
nav.secundaria button[aria-selected=true]{background:var(--tinta);border-color:var(--tinta);color:#fff}
.pag{display:flex;flex-direction:column;gap:18px}.pag[hidden]{display:none!important}
#p-estudos .aba{display:flex;flex-direction:column;gap:18px}#p-estudos .aba[hidden]{display:none!important}
/* placar grande: o elemento marcante */
.placar{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,2fr);gap:0;background:#fff;border:1px solid var(--linha);border-radius:10px;overflow:hidden}
.placar .grande{padding:22px 24px;border-right:1px solid var(--linha);display:flex;flex-direction:column;justify-content:center}
.placar .grande .n{font-family:'IBM Plex Sans Condensed',sans-serif;font-weight:700;font-size:84px;line-height:.9;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.placar .grande .n small{font-size:30px;font-weight:600;color:var(--grafite);letter-spacing:0;margin-left:6px}
.placar .grande .rot{color:var(--grafite);margin-top:8px}
.placar .lado{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.placar .item{padding:18px 20px;border-bottom:1px solid var(--linha);border-left:1px solid var(--linha);margin-left:-1px}
.placar .item span{display:block;color:var(--grafite);font-size:13px}
.placar .item b{display:block;font-family:'IBM Plex Sans Condensed',sans-serif;font-weight:600;font-size:30px;line-height:1.15;font-variant-numeric:tabular-nums}
.placar .item em{font-style:normal;font-size:13px;color:var(--grafite)}
.pos{color:var(--mesa)}.neg{color:var(--baixa)}
.placar .grande .n .moeda{font-size:32px;font-weight:600;margin-right:4px;letter-spacing:0}
.wrap a{color:var(--mesa);text-underline-offset:2px}.wrap a.btn{color:#fff}
.mk i.on.res{background:var(--mesa);border-color:var(--mesa);box-shadow:none}
@media (max-width:640px){.tbl-m thead{display:none}.tbl-m,.tbl-m tbody,.tbl-m tr,.tbl-m td{display:block;width:100%}
 .tbl-m tr{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;padding:12px 0;border-bottom:1px solid var(--linha)}
 .tbl-m td{border:0;padding:0}.tbl-m td[data-l]::before{content:attr(data-l);display:block;font-size:12px;color:var(--grafite)}
 .tbl-m td.larga{grid-column:1/-1}}
/* faixa de decisao */
.faixa{border-radius:10px;padding:22px 24px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;background:var(--tinta);color:#fff}
.faixa.jogar{background:var(--mesa)}
.faixa h2{font-family:'IBM Plex Sans Condensed',sans-serif;font-size:34px;font-weight:700;margin:2px 0 4px;letter-spacing:-.01em}
.faixa p{margin:0;color:rgba(255,255,255,.82);max-width:68ch}
.faixa .lado{text-align:right;color:rgba(255,255,255,.82);font-size:14px;line-height:1.6}
.faixa .lado b{color:#fff;font-weight:600}
/* opcoes de jogo */
.opcoes{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.opcao{background:#fff;border:1px solid var(--linha);border-radius:10px;padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.opcao.rec{border-color:var(--mesa);box-shadow:inset 0 3px 0 var(--mesa)}
.opcao h3{margin:0;font-size:16px}.opcao .tag{font-size:12px;font-weight:600;color:var(--mesa);background:var(--mesa2);border-radius:999px;padding:2px 9px;margin-left:8px;vertical-align:2px}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.trio div{border-top:1px solid var(--linha);padding-top:8px}.trio span{display:block;font-size:13px;color:var(--grafite)}
.trio b{font-family:'IBM Plex Sans Condensed',sans-serif;font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.acoes{display:flex;gap:8px;flex-wrap:wrap}
/* lista de jogos */
.jogos{width:100%;border-collapse:collapse}
.jogos td{padding:9px 8px;border-bottom:1px solid #ECEEF0}
.jogos tr:last-child td{border-bottom:0}
.jogos .n{color:var(--grafite);width:28px;font-variant-numeric:tabular-nums}
.jogos .t{font-weight:500}
.jogos .t small{display:block;font-weight:400;color:var(--grafite);font-size:12.5px}
.mk{display:inline-flex;gap:4px}
.mk i{font-style:normal;width:26px;height:26px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:600;color:#9AA3AA;border:1px solid var(--linha);background:#fff}
.mk i.on{background:var(--tinta);border-color:var(--tinta);color:#fff}
.mk i.res{box-shadow:0 0 0 2px var(--mesa)}
.mk i.res.fora{box-shadow:0 0 0 2px var(--baixa)}
.pb{display:flex;height:6px;border-radius:3px;overflow:hidden;min-width:120px;background:#ECEEF0}
.pb span:nth-child(1){background:var(--tinta)}.pb span:nth-child(2){background:#9AA3AA}.pb span:nth-child(3){background:#5F7F9A}
.pbn{display:flex;justify-content:space-between;font-size:12px;color:var(--grafite);font-variant-numeric:tabular-nums;margin-top:3px;min-width:120px}
.st{font-weight:600;white-space:nowrap}.st.ok{color:var(--mesa)}.st.no{color:var(--baixa)}.st.ag{color:var(--grafite);font-weight:400}
.ao::before{background:var(--baixa)}
/* avisos e licoes */
.nota{border-left:3px solid var(--ouro);background:var(--ouro2);padding:12px 16px;border-radius:0 8px 8px 0;font-size:14.5px}
.nota.inf{border-left-color:var(--grafite);background:#EEF0F1}
.nota.er{border-left-color:var(--baixa);background:var(--baixa2)}
.aprende{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.aprende li{padding:10px 14px;border:1px solid var(--linha);border-radius:8px;background:#fff}
.aprende li b{font-weight:600}
.pendente{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 18px;border:1px solid var(--ouro);background:var(--ouro2);border-radius:10px}
.linha-sel{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.vazio{text-align:center;padding:36px 20px;color:var(--grafite)}
.vazio b{display:block;color:var(--tinta);font-size:17px;margin-bottom:6px}
select.sel,input.sel{border-color:#C9CED2;border-radius:7px}
.graf{height:260px}
/* dialogo */
.dlg{border:0;border-radius:12px;padding:0;max-width:560px;width:calc(100% - 32px);box-shadow:0 24px 60px rgba(22,32,42,.25)}
.dlg::backdrop{background:rgba(22,32,42,.45)}
.dlg form{padding:22px 24px;display:flex;flex-direction:column;gap:14px}
.dlg h2{margin:0}.dlg label{display:flex;flex-direction:column;gap:6px;font-weight:500;font-size:14px}
.dlg textarea{min-height:120px;border:1px solid #C9CED2;border-radius:7px;padding:8px;font:13px/1.45 ui-monospace,Consolas,monospace}
.dlg .acoes{justify-content:flex-end}
.dlg.largo{max-width:720px}
.vsel-wrap{max-height:52vh;overflow:auto;border:1px solid var(--linha);border-radius:8px}
.vsel{width:100%;border-collapse:collapse}
.vsel td{padding:5px 6px;border-bottom:1px solid var(--linha);font-size:13px;vertical-align:middle}
.vsel tr:last-child td{border-bottom:0}
.vsel td.n{color:var(--grafite);width:22px;text-align:right}
.vsel td.t{line-height:1.25}
.vsel td.b{white-space:nowrap;text-align:right}
.vb{position:relative;width:64px;height:38px;margin-left:4px;border:1px solid #C9CED2;border-radius:7px;background:#fff;cursor:pointer;overflow:hidden;font:inherit;color:var(--tinta);padding:0}
.vb b{display:block;font-size:14px;line-height:1.1}.vb small{display:block;font-size:10.5px;color:var(--grafite)}
.vb i{position:absolute;left:0;bottom:0;height:4px;background:var(--mesa);opacity:.45}
.vb.sug{box-shadow:inset 0 0 0 2px var(--ouro)}
.vb.on{background:var(--mesa);border-color:var(--mesa);color:#fff}.vb.on small{color:#DCEBE4}.vb.on i{background:#fff}
.vresumo{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:13.5px}
.vresumo b{font-size:15px}.vresumo .er{color:var(--baixa);font-weight:600}
.vlegenda{font-size:12px;color:var(--grafite);margin:0}
.vlink{background:none;border:0;padding:0;color:var(--mesa);text-decoration:underline;cursor:pointer;font:inherit;font-size:13px}
.escolha{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.escolha label{flex-direction:row;align-items:center;gap:8px;border:1px solid var(--linha);border-radius:8px;padding:10px 12px;cursor:pointer;font-weight:500}
.escolha input{accent-color:var(--mesa)}
@media (max-width:760px){.placar{grid-template-columns:1fr}.placar .grande{border-right:0;border-bottom:1px solid var(--linha)}.placar .grande .n{font-size:68px}.faixa{grid-template-columns:1fr}.faixa .lado{text-align:left}.faixa h2{font-size:28px}.trio b{font-size:20px}.jogos .pbc{display:none}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
@media print{.topo,nav.secundaria,#p-semana,#p-conf,#p-banca{display:none!important}}
</style>
</head>
<body>
<div class="wrap">
<header class="topo">
<div class="marca-app"><span class="logo">Loteca Elite Pro</span><span class="sub" id="gerado">Carregando…</span></div>
<nav class="principal" role="tablist" aria-label="Seções">
<button role="tab" data-pag="p-semana" aria-selected="true">Semana</button>
<button role="tab" data-pag="p-conf" aria-selected="false">Conferência</button>
<button role="tab" data-pag="p-banca" aria-selected="false">Banca</button>
<button role="tab" data-pag="p-estudos" aria-selected="false">Estudos</button>
</nav>
</header>

<section id="p-semana" class="pag"></section>
<section id="p-conf" class="pag" hidden></section>
<section id="p-banca" class="pag" hidden></section>
<section id="p-estudos" class="pag" hidden>
<nav class="secundaria" role="tablist" aria-label="Estudos e ferramentas">
<button role="tab" data-aba="volante" aria-selected="true">Montar volante</button>
<button role="tab" data-aba="apostas" aria-selected="false">Lista de apostas</button>
<button role="tab" data-aba="semana" aria-selected="false">Análise da semana</button>
<button role="tab" data-aba="vivo" aria-selected="false">Placar ao vivo</button>
<button role="tab" data-aba="historico" aria-selected="false">Histórico</button>
<button role="tab" data-aba="erros" aria-selected="false">Onde erramos</button>
<button role="tab" data-aba="financeiro" aria-selected="false">Simulações</button>
<button role="tab" data-aba="kpis" aria-selected="false">Sites e KPIs</button>
</nav>
<section id="volante" class="aba"></section>
<section id="vivo" class="aba" hidden></section>
<section id="semana" class="aba" hidden></section>
<section id="apostas" class="aba" hidden></section>
<section id="meujogo" class="aba" hidden></section>
<section id="desdobre" class="aba" hidden></section>
<section id="financeiro" class="aba" hidden></section>
<section id="historico" class="aba" hidden></section>
<section id="erros" class="aba" hidden></section>
<section id="kpis" class="aba" hidden></section>
</section>
</div>
<dialog id="dlg" class="dlg"></dialog>
<script>
var D = null, V = null, R = '1X2';
function pc(v, c) { return v == null ? '—' : (v * 100).toFixed(c == null ? 1 : c).replace('.', ',') + '%'; }
function brl(v) { return v == null ? '—' : 'R$ ' + Math.round(v).toLocaleString('pt-BR'); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function nome(s) { return esc(String(s || '').split('/')[0].toLowerCase().replace(/(^|\s)\S/g, function (t) { return t.toUpperCase(); })); }
function marca(sel, res) {
  return '<span class="marca">' + [0, 1, 2].map(function (k) { var t = R[k], on = sel.indexOf(t) >= 0, r = res === t;
    return '<i class="' + (on ? 'on' : '') + (r ? ' res' : '') + '">' + t + '</i>'; }).join('') + '</span>';
}
function barra(p) {
  var cor = ['#0B6B50', '#6B7280', '#1D4ED8'];
  return '<div class="barra" role="img" aria-label="1 ' + pc(p[0], 0) + ', X ' + pc(p[1], 0) + ', 2 ' + pc(p[2], 0) + '">' +
    p.map(function (x, k) { return '<span style="width:' + (x * 100) + '%;background:' + cor[k] + '">' + (x >= .12 ? Math.round(x * 100) + '%' : '') + '</span>'; }).join('') + '</div>';
}
function irPara(pag, sub) {
  document.querySelectorAll('nav.principal button').forEach(function (x) { x.setAttribute('aria-selected', x.dataset.pag === pag ? 'true' : 'false'); });
  document.querySelectorAll('.pag').forEach(function (s) { s.hidden = s.id !== pag; });
  if (sub) document.querySelectorAll('nav.secundaria button').forEach(function (x) { if (x.dataset.aba === sub) x.click(); });
  if (D) { var f = { 'p-conf': pagConferencia, 'p-banca': pagBanca, 'p-semana': pagSemana }[pag]; if (f) f(); }
  window.scrollTo({ top: 0 });
}
document.querySelectorAll('nav.principal button').forEach(function (b) { b.addEventListener('click', function () { irPara(b.dataset.pag); }); });
document.querySelectorAll('nav.secundaria button').forEach(function (b) {
  b.addEventListener('click', function () {
    document.querySelectorAll('nav.secundaria button').forEach(function (x) { x.setAttribute('aria-selected', x === b ? 'true' : 'false'); });
    document.querySelectorAll('.aba').forEach(function (s) { s.hidden = s.id !== b.dataset.aba; });
    if (D) { var f = { financeiro: abaFinanceiro, historico: abaHistorico, erros: abaErros }[b.dataset.aba]; if (f) f(); }
  });
});

function semanaJogos() { return D && D.semana ? D.semana.jogos : []; }
function cartelaSimples() { var d = D.semana && D.semana.desdobre; return d ? d.simples.cartela : null; }

function abaVivo() {
  var el = document.getElementById('vivo');
  if (!V || !D || !D.semana || V.concurso !== D.semana.concurso) {
    el.innerHTML = '<div class="card"><h2>Ao vivo</h2><p class="sub">Os placares aparecem aqui durante os jogos do concurso aberto (atualização a cada 15 minutos).</p></div>'; return;
  }
  var simp = cartelaSimples(), vols = D.semana.desdobre ? D.semana.desdobre.espalhado.volantes : [];
  var res = {}; V.jogos.forEach(function (g) { res[g.jogo] = g; });
  var ptsS = 0, perdS = 0, linhas = '';
  semanaJogos().forEach(function (j, i) {
    var g = res[j.jogo] || {}, r = g.resultado, enc = g.situacao === 'encerrado';
    var s = simp ? simp[i] : '';
    var fv = R[fav(j.p)], quase = enc ? '' : ' agora';
    var st = r == null ? '<span class="wait">aguardando</span>' : (s.indexOf(r) >= 0 ? '<span class="ok">✓ ' + (enc ? 'acertou' : 'acertando agora') + '</span>' : '<span class="no">✗ ' + (enc ? 'errou' : 'errando agora') + '</span>');
    var stF = r == null ? '' : (fv === r ? '<span class="ok">✓</span>' : '<span class="no">✗</span>');
    if (r != null && s.indexOf(r) >= 0) ptsS++; if (r != null && enc && s.indexOf(r) < 0) perdS++;
    var sit = g.situacao && g.situacao.indexOf('ao vivo') === 0 ? '<span class="ao">' + esc(g.situacao) + '</span>' : esc(g.situacao || '');
    linhas += '<tr><td>' + j.jogo + '</td><td>' + nome(j.mandante) + ' × ' + nome(j.visitante) + '</td><td><b>' + (g.placar ? g.placar.join(' × ') : '—') + '</b></td><td>' + sit + '</td><td>' + fv + ' ' + stF + '</td><td>' + marca(s, r) + '</td><td>' + st + '</td></tr>';
  });
  var melhor = 0, n13 = 0;
  vols.forEach(function (v) { var p = 0; semanaJogos().forEach(function (j, i) { var r = (res[j.jogo] || {}).resultado; if (r != null && v[i].indexOf(r) >= 0) p++; }); if (p > melhor) melhor = p; });
  var jogados = V.jogos.filter(function (g) { return g.resultado != null; }).length;
  var tAt = Date.parse(V.atualizado_utc.replace('Z', ':00Z')), minAt = Math.round((Date.now() - tAt) / 60000), pend = V.jogos.some(function (g) { return g.situacao !== 'encerrado' && g.situacao !== 'cancelado'; });
  var hora = isNaN(tAt) ? esc(V.atualizado_utc) : new Date(tAt).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
  var velho = pend && minAt > 30 ? '<div class="vaviso er" style="margin:8px 0">Placar atrasado: a última atualização foi há ' + minAt + ' min. Os jogos "ao vivo" abaixo podem já ter mudado. O painel tenta atualizar sozinho a cada minuto.</div>' : '';
  el.innerHTML = '<div class="card"><h2>Concurso ' + V.concurso + ' — ao vivo</h2>' + velho + '<p class="sub">Atualizado ' + hora + ' (horário de Brasília) · ' + jogados + ' de 14 jogos com placar. Verde = nossa marcação; contorno preto = resultado do momento dentro dela; contorno vermelho = fora dela.</p>' +
    '<div class="grid" style="margin-bottom:12px"><div class="stat"><span>Jogo perfeito (' + (D.semana.desdobre ? esc(D.semana.desdobre.simples.estrutura) : '') + ')</span><b>' + ptsS + ' pts</b><span>' + perdS + ' erro(s) já confirmado(s)</span></div>' +
    '<div class="stat"><span>Desdobre espalhado — melhor volante</span><b>' + melhor + ' pts</b><span>de ' + jogados + ' jogos com placar</span></div></div>' +
    '<div class="rolagem"><table><thead><tr><th>#</th><th>Jogo</th><th>Placar</th><th>Situação</th><th>Favorito do modelo</th><th>Jogo perfeito</th><th></th></tr></thead><tbody>' + linhas + '</tbody></table></div></div>';
}

var PLP = null;
function cardPlacarPilares() {
  if (!PLP || !PLP.vertentes || !PLP.vertentes.length) return '';
  var cs = {}; PLP.vertentes.forEach(function (v) { Object.keys(v.por_concurso).forEach(function (c) { cs[c] = 1; }); }); cs = Object.keys(cs).sort();
  return '<div class="card"><h2>Placar de acertos por vertente</h2><p class="sub">Cada vertente gravada antes dos jogos e conferida depois. Pilares: acerto do favorito; votos (Elo, xG, domínio...): acertou quando o lado que ele favorecia venceu (empate conta como erro). O 1284 foi calculado depois dos jogos, só com dados de antes (retroativo); a partir do 1285 vale a previsão gravada na semana.</p>' +
    '<div class="rolagem"><table><thead><tr><th>Vertente</th><th>Acertos</th><th>%</th>' + cs.map(function (c) { return '<th>' + c + '</th>'; }).join('') + '</tr></thead><tbody>' +
    PLP.vertentes.map(function (v) { return '<tr><td><b>' + esc(v.nome) + '</b></td><td>' + v.acertos + ' de ' + v.jogos + '</td><td>' + pc(v.acerto, 0) + '</td>' + cs.map(function (c) { var t = v.por_concurso[c]; return '<td>' + (t ? t[1] + '/' + t[0] : '—') + '</td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table></div></div>';
}
var PIL = null;
function cardPilares() { // opiniao de cada vertente, jogo a jogo, lado a lado
  if (!PIL || !D.semana || PIL.concurso !== D.semana.concurso) return '<div class="card"><h2>Pilares do jogo</h2><p class="sub">Os pilares sem odds deste concurso ainda não foram calculados.</p></div>';
  var J = semanaJogos(), por = {}; PIL.jogos.forEach(function (g) { por[g.jogo] = g; });
  var cor = function (v, a, b) { return v == null ? '<td class="wait">—</td>' : '<td style="color:' + (v > a ? '#0B6B50' : (v < b ? '#B42318' : '#374151')) + ';font-weight:600">' + v + '</td>'; };
  var sn = function (v, d) { return v == null ? null : (v > 0 ? '+' : '') + v.toFixed(d); };
  var lin = J.map(function (j) { var g = por[j.jogo] || {}, x = g.x || {}, pm = j.p, pp = g.p;
    var fm = R[fav(pm)], fp = pp ? R[fav(pp)] : null, briga = pp && fp !== fm, eqp = pp && Math.max.apply(null, pp) < 0.42 && Math.max.apply(null, pm) > 0.55;
    return '<tr' + (briga || eqp ? ' style="background:#FFF7E6"' : '') + '><td>' + j.jogo + '</td><td>' + esc(nome2(j.mandante)) + ' × ' + esc(nome2(j.visitante)) + '</td><td>' + barra(pm) + '</td><td>' + (pp ? barra(pp) : '<span class="sub">' + (g.jogos_base ? 'sem histórico (' + g.jogos_base.join('/') + ' jogos)' : '—') + '</span>') + '</td>' +
      cor(x.elo != null ? sn(x.elo * 100, 0) : null, 50, -50).replace('>' + sn(x.elo * 100, 0) + '<', '>' + sn(x.elo * 100, 0) + '<') +
      cor(sn(x.xg_saldo, 2), 0.3, -0.3) + cor(x.dom != null ? sn(x.dom * 100, 0) : null, 5, -5) + cor(sn(x.forma5, 1), 0.5, -0.5) +
      cor(sn(x.descanso, 1), 1.5, -1.5) + '<td>' + (x.copa ? (x.copa > 0 ? 'mandante' : 'visitante') : '') + '</td><td>' + (x.viagem != null ? Math.round(x.viagem * 1000) + ' km' : '') + '</td><td>' + (x.sintetico ? 'sim' : '') + '</td>' +
      '<td>' + (briga ? '<b>discordam</b>' : (eqp ? '<b>pilares: equilibrado</b>' : '')) + '</td></tr>'; }).join('');
  var t = PIL.teste || {}, tt = t.todos || {}, od = t.odds || {};
  return '<div class="card"><h2>Pilares do jogo — concurso ' + PIL.concurso + '</h2><p class="sub">Cada vertente separada. "Mercado" = odds; "Pilares" = força própria, xG, domínio, forma, calendário, viagem, gramado e árbitro juntos, <b>sem nenhuma odd</b>. Linha amarela = as vertentes discordam.' +
    (tt.acerto ? ' No teste (' + (t.jogos_modelo || '') + ' jogos, sempre ajustando só com o passado), os pilares acertaram o favorito ' + pc(tt.acerto, 1) + (od.acerto_odds ? ' e as odds ' + pc(od.acerto_odds, 1) + ' nos mesmos jogos' : '') + '.' : '') + '</p>' +
    '<div class="rolagem"><table><thead><tr><th>#</th><th>Jogo</th><th>Mercado</th><th>Pilares (sem odds)</th><th>Elo</th><th>Saldo xG</th><th>Domínio</th><th>Forma</th><th>Descanso</th><th>Copa perto</th><th>Viagem</th><th>Sintético</th><th></th></tr></thead><tbody>' + lin + '</tbody></table></div>' +
    '<p class="sub">Elo, saldo de xG (últimos 8), domínio (pontos % de toques na área), forma (pontos por jogo, últimos 5) e descanso (dias): diferença mandante − visitante; verde favorece o mandante, vermelho o visitante.</p></div>';
}
function abaSemana() {
  var S = D.semana, el = document.getElementById('semana');
  if (!S) { el.innerHTML = '<div class="card">Sem concurso aberto.</div>'; return; }
  var d = S.decisao, h = '';
  if (d) {
    var ap = d.apostar > 0;
    h += '<div class="decisao ' + (ap ? 'apostar' : 'guardar') + '"><span>Decisão do concurso ' + S.concurso + '</span><b>' + (ap ? 'Apostar ' + brl(d.apostar) : 'Não apostar — guardar ' + brl(d.deposito)) + '</b><span>' +
      (ap ? 'Semana em que o jogo se paga em média.' : esc(d.motivo || '')) + ' · Cofrinho: ' + brl(d.saldo) + ' guardados · prêmio estimado ' + brl(d.premio) + '</span></div>';
    h += '<div class="card"><h2>Como a decisão foi tomada</h2><p class="sub">O sistema guarda ' + brl(d.deposito) + ' por semana e só aposta quando alguma cartela devolve mais do que custa, em média (retorno esperado acima de ' + pc(d.retorno_minimo, 0) + '). Isso acontece quando o prêmio acumula muito. Nas semanas comuns, apostar R$ 200 devolve cerca de 20% em média.</p><div class="rolagem"><table><thead><tr><th>Aposta</th><th>Cartela</th><th>Chance de 14</th><th>Chance de 13 ou 14</th><th>Volta, em média, por R$ 1</th></tr></thead><tbody>' +
      d.orcamentos.map(function (o) { var b = o.retorno >= d.retorno_minimo; return '<tr' + (o.valor === d.apostar ? ' style="background:var(--verde2)"' : '') + '><td>' + brl(o.valor) + '</td><td>' + esc(o.estrutura) + '</td><td>' + pc(o.p14, 2) + '</td><td>' + pc(o.p13 + o.p14, 1) + '</td><td class="' + (b ? 'ok' : '') + '">R$ ' + o.retorno.toFixed(2).replace('.', ',') + '</td></tr>'; }).join('') + '</tbody></table></div></div>';
  }
  var simp = cartelaSimples();
  h += '<div class="card"><h2>Os 14 jogos e o jogo perfeito para R$ 200</h2><p class="sub">Probabilidades do motor (odds sem margem, empate ajustado). O jogo perfeito é a cartela de maior chance de 14 que cabe em R$ 200' + (S.desdobre ? ': ' + esc(S.desdobre.simples.estrutura) + ', ' + brl(S.desdobre.simples.custo) + ', chance de 14 de ' + pc(S.desdobre.simples.p14, 2) : '') + '.</p><div class="rolagem"><table><thead><tr><th>#</th><th>Jogo</th><th>1 · X · 2</th><th>Jogo perfeito</th><th>Alertas</th></tr></thead><tbody>' +
    S.jogos.map(function (j, i) { return '<tr><td>' + j.jogo + '</td><td>' + nome(j.mandante) + ' × ' + nome(j.visitante) + '</td><td>' + barra(j.p) + '</td><td>' + (simp ? marca(simp[i], null) : '') + '</td><td>' + j.alertas.map(function (a) { return '<div class="alerta">' + esc(a) + '</div>'; }).join('') + '</td></tr>'; }).join('') + '</tbody></table></div></div>';
  var F = D.financeiro || [];
  if (F.length) {
    var g = 0, p = 0;
    h += '<div class="card"><h2>Placar financeiro</h2><div class="rolagem"><table><thead><tr><th>Concurso</th><th>Tipo</th><th>Aposta</th><th>Pontos</th><th>Prêmio</th></tr></thead><tbody>' +
      F.map(function (x) { g += x.valor; p += x.premio || 0; return '<tr><td>' + x.concurso + '</td><td>' + esc(x.tipo) + '</td><td>' + brl(x.valor) + ' (' + esc(x.estrutura) + ')</td><td>' + (x.pontos == null ? 'aguardando' : x.pontos) + '</td><td>' + (x.premio == null ? '—' : brl(x.premio)) + '</td></tr>'; }).join('') +
      '</tbody></table></div><p class="sub">Total apostado ' + brl(g) + ' · prêmios ' + brl(p) + ' · saldo ' + brl(p - g) + '</p></div>';
  }
  h = cardPilares() + cardPlacarPilares() + h; el.innerHTML = h;
}

function abaDesdobre() {
  var S = D.semana, el = document.getElementById('desdobre');
  if (!S || !S.desdobre) { el.innerHTML = '<div class="card">Desdobre ainda não gerado para este concurso.</div>'; return; }
  var e = S.desdobre.espalhado, s = S.desdobre.simples;
  var H = D.historico.filter(function (c) { return c.pts_espalhado != null; });
  var hs13 = H.filter(function (c) { return c.pts_simples >= 13; }).length, he13 = H.filter(function (c) { return c.pts_espalhado >= 13; }).length;
  var hs14 = H.filter(function (c) { return c.pts_simples === 14; }).length, he14 = H.filter(function (c) { return c.pts_espalhado === 14; }).length;
  el.innerHTML = '<div class="card"><h2>Desdobre espalhado do concurso ' + S.concurso + ' — ' + brl(e.custo) + '</h2>' +
    '<p class="sub">' + e.volantes.length + ' volantes de R$ 4, cada um com 1 duplo (o mínimo da Caixa), escolhidos na base ' + esc(e.base) + ' para cobrir o máximo de resultados a até 1 erro. Comparado com o jogo perfeito pelo mesmo dinheiro:</p>' +
    '<div class="grid"><div class="stat"><span>Jogo perfeito ' + esc(s.estrutura) + ' (' + brl(s.custo) + ')</span><b>' + pc(s.p13, 1) + '</b><span>chance de 13 ou 14 · 14: ' + pc(s.p14, 2) + '</span></div>' +
    '<div class="stat" style="background:var(--verde2)"><span>Desdobre espalhado (' + brl(e.custo) + ')</span><b>' + pc(e.p13, 1) + '</b><span>chance de 13 ou 14 · 14: ' + pc(e.p14, 2) + '</span></div>' +
    '<div class="stat"><span>No histórico (' + H.length + ' concursos)</span><b>' + he13 + ' × ' + hs13 + '</b><span>vezes com 13 ou 14 (desdobre × jogo perfeito) · 14: ' + he14 + ' × ' + hs14 + '</span></div></div>' +
    '<h3>Volantes para jogar</h3><div id="dvols"></div></div>';
  renderVolantes('dvols', e.volantes, 'loteca_' + S.concurso + '_desdobre', S.jogos);
}

var aberto = null;
function abaHistorico() {

function fechamento(base, P, nd, nt, garantia) {
  var vars = [], opts = []; base.forEach(function (t, i) { if (t.length > 1) { vars.push(i); opts.push(t.split('').map(function (k) { return R.indexOf(k); })); } });

  VSEL.res = VSEL.modo === 'inteiro' && !VSEL.m.some(function (x) { return !x.length; }) ? vselCalcula(c) : null;
  vselMostraDes(box, c);
}
function vselRender(box, c) {
  var js = vselGrade(c), sug = vselSugestao(c);
  if (!js) { box.innerHTML = '<p class="sub" style="margin:0">Não tenho a grade do concurso ' + esc(String(c)) + ' no painel. Use “colar volantes” abaixo.</p>'; return false; }
  if (VSEL.c !== Number(c) || VSEL.m.length !== 14) { VSEL.c = Number(c); VSEL.m = js.map(function () { return []; }); }
  box.innerHTML = '<div class="linha-sel" style="justify-content:space-between;gap:8px;flex-wrap:wrap"><div class="vresumo" id="vres">' + vselResumo() + '</div>' +
    '<span><button type="button" class="btn" id="vsug">Usar a sugestão do motor</button> <button type="button" class="btn" id="vlimpa">Limpar</button></span></div>' +
    '<div class="vsel-wrap"><table class="vsel"><tbody>' + js.map(function (j, i) {
      var p = j.p || [null, null, null];
      return '<tr><td class="n">' + (i + 1) + '</td><td class="t">' + nomeT(j.m) + ' × ' + nomeT(j.v) + '</td><td class="b">' + ['1', 'X', '2'].map(function (k, q) {
        var on = VSEL.m[i].indexOf(k) >= 0, sg = sug && sug[i].indexOf(k) >= 0;
        return '<button type="button" class="vb' + (on ? ' on' : '') + (sg ? ' sug' : '') + '" data-i="' + i + '" data-k="' + k + '"><b>' + k + '</b><small>' + (p[q] != null ? pc(p[q], 0) : '') + '</small>' + (p[q] != null ? '<i style="width:' + Math.round(p[q] * 100) + '%"></i>' : '') + '</button>';
      }).join('') + '</td></tr>';
    }).join('') + '</tbody></table></div><p class="vlegenda">Clique para marcar ou desmarcar. Número = chance do motor; barra = tamanho da chance; contorno dourado = sugestão do motor.</p>' +
    '<div class="card" style="margin:0;padding:12px 14px"><b>Como jogar esta base</b>' +
    '<div class="escolha" style="grid-template-columns:1fr;margin-top:8px">' +
    '<label><input type="radio" name="vmodo" value="inteiro"' + (VSEL.modo === 'inteiro' ? ' checked' : '') + '> Jogo inteiro (dividido em volantes válidos da Caixa, se precisar)</label>' +
    '<label><input type="radio" name="vmodo" value="espalhado"' + (VSEL.modo === 'espalhado' ? ' checked' : '') + '> Desdobre espalhado: as melhores partes da base por <input class="sel" id="vorc" type="number" min="4" step="4" value="' + VSEL.orc + '" style="width:90px;margin:0 4px"> reais</label>' +
    '<label><input type="radio" name="vmodo" value="fecha"' + (VSEL.modo === 'fecha' ? ' checked' : '') + '> Fechamento: garante 13 se a base acertar (volantes de 1 duplo, R$ 4 cada)</label></div>' +
    '<div class="linha-sel" style="gap:10px;margin-top:8px;flex-wrap:wrap"><button type="button" class="btn pri" id="vcalc"' + (VSEL.modo === 'inteiro' ? ' hidden' : '') + '>Calcular desdobre</button><div class="vresumo" id="vdes"></div></div></div>';
  box.querySelectorAll('.vb').forEach(function (b) {
    b.onclick = function () {
      var i = Number(b.dataset.i), k = b.dataset.k, a = VSEL.m[i], pos = a.indexOf(k);
      if (pos >= 0) a.splice(pos, 1); else a.push(k);
      b.classList.toggle('on'); vselAtualiza(box, c);
    };
  });
  box.querySelector('#vsug').onclick = function () { VSEL.m = sug.map(function (x) { return x.split(''); }); vselRender(box, c); };
  box.querySelector('#vlimpa').onclick = function () { VSEL.m = js.map(function () { return []; }); vselRender(box, c); };
  box.querySelectorAll('input[name=vmodo]').forEach(function (r) { r.onchange = function () { VSEL.modo = r.value; box.querySelector('#vcalc').hidden = VSEL.modo === 'inteiro'; vselAtualiza(box, c); }; });
  box.querySelector('#vorc').onchange = function () { VSEL.orc = Number(this.value) || 0; if (VSEL.modo === 'espalhado') { VSEL.res = null; vselMostraDes(box, c); } };
  box.querySelector('#vcalc').onclick = function () { var bt = this; bt.disabled = true; bt.textContent = 'Calculando…'; setTimeout(function () { VSEL.res = vselCalcula(c); vselMostraDes(box, c); bt.disabled = false; bt.textContent = 'Calcular desdobre'; }, 30); };
  vselAtualiza(box, c);
  return true;
}

function bancaRegistrar(pre) { // dialogo para registrar uma aposta (pre: {concurso, vols, origem})
  var dlg = document.getElementById('dlg'), conc = pre.concurso || (D.semana && D.semana.concurso) || '';
  dlg.innerHTML = '<form method="dialog"><h2>Registrar aposta</h2>' +
    '<label>Concurso<input class="sel" name="c" type="number" value="' + conc + '" required></label>' +
    (pre.vols ? '<p style="margin:0">' + pre.vols.length + ' volante(s), ' + brl(custoVols(pre.vols)) + (pre.origem ? ' · ' + esc(pre.origem) : '') + '</p>'
      : '<div id="vselbox"></div><div><button type="button" class="vlink" id="vcolar">Colar vários volantes (avançado)</button></div>' +
        '<label id="vcolararea" hidden>Volantes (um por linha, como no SpeedLoto: 1;2.x;1;…)<textarea name="v" placeholder="1;x;2;1.x;..."></textarea></label><label>Descrição<input class="sel" name="o" value="Aposta manual"></label>') +
    '<div class="escolha"><label><input type="radio" name="s" value="pago" checked> Já paguei</label><label><input type="radio" name="s" value="carrinho"> Está no carrinho</label></div>' +
    '<p class="sub" style="margin:0">' + (BANCA.servidor ? 'Fica guardado na banca e aparece em qualquer aparelho.' : 'A banca está guardada só neste aparelho até a chave de gravação ser configurada.') + '</p>' +
    '<div class="acoes"><button class="btn" value="cancelar">Cancelar</button><button class="btn pri" value="ok">Registrar</button></div></form>';
  dlg.onclose = function () {
    if (dlg.returnValue !== 'ok') return;
    var f = dlg.querySelector('form'), vols = pre.vols;
    if (!vols && f.v && f.v.value.trim()) vols = f.v.value.split(/\r?\n/).map(apParse).filter(Boolean);
    else if (!vols) {
      if (VSEL.m.length !== 14 || VSEL.m.some(function (x) { return !x.length; })) { alert('Marque os 14 jogos do volante.'); return; }
      if (!VSEL.res) VSEL.res = vselCalcula(VSEL.c);
      if (VSEL.res.erro) { alert(VSEL.res.erro); return; }
      vols = VSEL.res.vols;
    }
    if (!vols || !vols.length) { alert('Nenhum volante válido (cada linha precisa dos 14 jogos).'); return; }
    bancaAcao({ acao: 'adicionar', aposta: { concurso: Number(f.c.value), vols: vols, origem: pre.origem || (f.o ? f.o.value : ''), status: f.s.value } })
      .then(function (j) { if (j && j.ok) irPara('p-banca'); });
  };
  dlg.classList.toggle('largo', !pre.vols);
  if (!pre.vols) {
    var box = dlg.querySelector('#vselbox'), fc = dlg.querySelector('input[name=c]');
    VSEL = { c: null, m: [], modo: 'inteiro', orc: 200, res: null }; vselRender(box, fc.value);
    fc.onchange = function () { vselRender(box, fc.value); };
    dlg.querySelector('#vcolar').onclick = function () { var a = dlg.querySelector('#vcolararea'); a.hidden = !a.hidden; };
  }
  dlg.showModal();
}

// ---------------------------------------------------------------- resultado de um concurso (oficial ou ao vivo)
function resultadoDe(c) {
  var r = RS && RS.concursos && RS.concursos[String(c)];
  if (r) return { res: r.res.split(''), final: true, jogos: r.jogos.map(function (j) { return { m: j.m, v: j.v, placar: j.placar, sit: 'encerrado' }; }),
    rateio: r.rateio ? { premio14: r.premio14, premio13: r.premio13, g14: r.ganhadores14, g13: r.ganhadores13, acumulou: r.acumulou } : null, data: r.data };
  if (V && V.concurso === c) {
    var js = V.jogos.slice().sort(function (a, b) { return a.jogo - b.jogo; });
    var fim = js.length === 14 && js.every(function (g) { return g.situacao === 'encerrado' && g.resultado; });
    return { res: js.map(function (g) { return g.resultado || null; }), final: false, fim: fim, ao_vivo: !fim, atualizado: V.atualizado_utc,
      jogos: js.map(function (g) { return { m: g.mandante, v: g.visitante, placar: g.placar, sit: g.situacao || '' }; }), rateio: null };
  }
  return null;
}
function probsDe(c) { // probabilidades do motor para o concurso (para explicar os erros)
  if (D.semana && D.semana.concurso === c) return D.semana.jogos.map(function (j) { return j.p; });
  var h = (D.historico || []).filter(function (x) { return x.c === c; })[0];
  return h ? h.jogos.map(function (g) { return g.p; }) : null;
}
function confere(vols, Rz, parte) {
  var res = Rz.res, conhecidos = res.filter(function (x) { return x != null; }).length, melhor = 0, maxPos = 0, n14 = 0, n13 = 0, dist = {};
  vols.forEach(function (v) {
    var ac = 0, er = [], i;
    for (i = 0; i < 14; i++) { if (res[i] == null) continue; if (v[i].indexOf(res[i]) >= 0) ac++; else er.push(i); }
    melhor = Math.max(melhor, ac); maxPos = Math.max(maxPos, 14 - er.length); dist[ac] = (dist[ac] || 0) + 1;
    if (Rz.final) { if (!er.length) { n14 += 1; n13 += v.reduce(function (a, t) { return a + t.length - 1; }, 0); } else if (er.length === 1) n13 += v[er[0]].length; }
  });
  var cobertura = res.map(function (r, i) { return r == null ? null : vols.filter(function (v) { return v[i].indexOf(r) >= 0; }).length; });
  var premio = null;
  if (Rz.final && Rz.rateio) premio = (n14 * (Rz.rateio.premio14 || 0) + n13 * (Rz.rateio.premio13 || 0)) * (parte || 1);
  return { melhor: melhor, maxPos: maxPos, conhecidos: conhecidos, n14: n14, n13: n13, premio: premio, cobertura: cobertura, dist: dist };
}
function apostasDo(c) { return BANCA.lista.filter(function (a) { return a.concurso === c && a.status !== 'cancelado'; }); }
function uniao(vols) { return Array.from({ length: 14 }, function (_, i) { return R.split('').filter(function (k) { return vols.some(function (v) { return v[i].indexOf(k) >= 0; }); }).join(''); }); }

// ---------------------------------------------------------------- SEMANA
function pagSemana() {
  var el = document.getElementById('p-semana'), S = D.semana;
  if (!S) { el.innerHTML = '<div class="card vazio"><b>Nenhum concurso aberto agora.</b>A grade nova aparece aqui assim que a Caixa publicar.</div>'; return; }
  var d = S.decisao, ds = S.desdobre, h = '';
  if (d) {
    var jogar = d.apostar > 0;
    h += '<div class="faixa' + (jogar ? ' jogar' : '') + '"><div><span>Concurso ' + S.concurso + '</span><h2>' + (jogar ? 'Jogar ' + brl(d.apostar) + ' nesta semana' : 'Semana para jogar o mínimo') + '</h2><p>' +
      (jogar ? 'O retorno esperado passa do que a aposta custa. É uma das poucas semanas em que vale investir mais.' :
        'O retorno esperado das cartelas grandes fica abaixo do que custam (melhor: ' + pc(Math.max.apply(null, d.orcamentos.map(function (o) { return o.retorno; })), 0) + '). Se for jogar, fique no desdobre de R$ 200.') + '</p></div>' +
      '<div class="lado">Prêmio estimado <b>' + brl(d.premio) + '</b><br>Guardado no cofrinho <b>' + brl(d.saldo) + '</b></div></div>';
  }
  var ja = apostasDo(S.concurso);
  if (ja.length) h += '<div class="nota inf">Você já registrou ' + pl(ja.length, 'aposta', 'apostas') + ' neste concurso, ' + brl(ja.reduce(function (a, x) { return a + x.custo; }, 0)) + '. <a href="#" data-ir="p-conf">Ver a conferência</a></div>';
  if (ds) {
    var esp = ds.espalhado, sim = ds.simples;
    var op = function (rec, titulo, txt, custo, p14, p13, chave) {
      return '<div class="opcao' + (rec ? ' rec' : '') + '"><div><h3>' + titulo + (rec ? '<span class="tag">recomendado</span>' : '') + '</h3><p class="sub" style="margin:6px 0 0">' + txt + '</p></div>' +
        '<div class="trio"><div><span>Custo</span><b>' + brl(custo) + '</b></div><div><span>Chance de 13+</span><b>' + pc(p13, 1) + '</b></div><div><span>Chance de 14</span><b>' + pc(p14, 2) + '</b></div></div>' +
        '<div class="acoes"><button class="btn pri" data-op="' + chave + '" data-a="caixa">Mandar para a Caixa</button><button class="btn" data-op="' + chave + '" data-a="reg">Registrar como jogado</button><button class="btn" data-op="' + chave + '" data-a="ver">Ver volantes</button></div></div>';
    };
    h += '<div class="opcoes">' +
      (esp ? op(true, 'Desdobre espalhado', esp.volantes.length + ' volantes que se cobrem entre si. No histórico fez 13 ou mais o dobro de vezes que o jogo simples, pelo mesmo valor.', esp.custo, esp.p14, esp.p13, 'esp') : '') +
      (sim ? op(false, 'Jogo simples ' + sim.estrutura, 'Uma cartela só, a de maior chance de 14 que cabe no orçamento.', sim.custo, sim.p14, sim.p13, 'sim') : '') + '</div><div id="semvols"></div>';
  }
  var simp = ds && ds.simples ? ds.simples.cartela : null;
  h += '<div class="card"><h2>Os 14 jogos</h2><p class="sub" style="margin-top:-6px">Chance de cada resultado pelo motor. As marcas são as do jogo simples.</p><div class="rolagem"><table class="jogos"><tbody>' +
    S.jogos.map(function (j, i) {
      return '<tr><td class="n">' + j.jogo + '</td><td class="t">' + nomeT(j.mandante) + ' × ' + nomeT(j.visitante) + (j.alertas && j.alertas.length ? '<small>' + j.alertas.map(esc).join(' ') + '</small>' : '') + '</td>' +
        '<td class="pbc" style="width:170px">' + pbar(j.p) + '</td><td style="width:100px;text-align:right">' + (simp ? mk(simp[i], null) : '') + '</td></tr>';
    }).join('') + '</tbody></table></div><p class="sub" style="margin-bottom:0">Quer mudar algum jogo? <a href="#" data-ir="p-estudos" data-sub="volante">Montar o seu volante</a>.</p></div>';
  el.innerHTML = h;
  el.querySelectorAll('[data-op]').forEach(function (b) {
    b.onclick = function () {
      var vols = b.dataset.op === 'esp' ? ds.espalhado.volantes : [ds.simples.cartela], nomeOp = b.dataset.op === 'esp' ? 'Desdobre espalhado' : 'Jogo simples ' + ds.simples.estrutura;
      if (b.dataset.a === 'reg') bancaRegistrar({ concurso: S.concurso, vols: vols, origem: nomeOp });
      else { renderVolantes('semvols', vols, 'loteca_' + S.concurso + '_' + (b.dataset.op === 'esp' ? 'desdobre' : 'simples'), S.jogos);
        var alvo = document.getElementById('semvols'); if (b.dataset.a === 'caixa') alvo.querySelector('[data-a=caixa]').click(); alvo.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
    };

}

// ---------------------------------------------------------------- CONFERÊNCIA
function concursosConf() {
  var cs = {}; BANCA.lista.forEach(function (a) { if (a.status !== 'cancelado') cs[a.concurso] = 1; });
  if (D.semana) cs[D.semana.concurso] = 1; if (V) cs[V.concurso] = 1;
  return Object.keys(cs).map(Number).sort(function (a, b) { return b - a; });
}
function pagConferencia() {
  var el = document.getElementById('p-conf'), cs = concursosConf();
  if (!cs.length) { el.innerHTML = '<div class="card vazio"><b>Nada para conferir ainda.</b>Registre uma aposta na aba Semana.</div>'; return; }
  if (CONF.c == null || cs.indexOf(CONF.c) < 0) { CONF.c = cs.filter(function (c) { return apostasDo(c).length; })[0] || cs[0]; }
  var c = CONF.c, Rz = resultadoDe(c), ap = apostasDo(c), h = '';
  h += '<div class="linha-sel"><label class="lb">Concurso <select class="sel" id="confsel">' + cs.map(function (x) { return '<option' + (x === c ? ' selected' : '') + '>' + x + '</option>'; }).join('') + '</select></label>' +
    (Rz && Rz.ao_vivo ? '<span class="ao">Ao vivo, atualizado ' + horaBR(Rz.atualizado) + '</span>' : Rz && Rz.fim ? '<span class="sub">Jogos encerrados, aguardando a apuração da Caixa</span>' : Rz && Rz.final ? '<span class="sub">Resultado oficial' + (Rz.data ? ' de ' + esc(Rz.data) : '') + '</span>' : '') + '</div>';
  var vols, rotulo, parte = 1, custo = 0;
  if (ap.length) { vols = []; ap.forEach(function (a) { vols = vols.concat(a.vols); custo += a.custo * a.minhas / a.total; }); parte = ap.length === 1 ? ap[0].minhas / ap[0].total : 1; rotulo = ap.length === 1 ? (ap[0].origem || 'Sua aposta') : ap.length + ' apostas suas'; }
  else if (D.semana && D.semana.concurso === c && D.semana.desdobre) { vols = D.semana.desdobre.espalhado.volantes; rotulo = 'Jogo recomendado (você não registrou aposta neste concurso)'; }
  if (!Rz) { el.innerHTML = h + '<div class="card vazio"><b>Os jogos ainda não começaram.</b>Os pontos aparecem aqui assim que o primeiro jogo tiver placar.</div>'; ligaConf(el); return; }
  if (!vols) { el.innerHTML = h + '<div class="card vazio"><b>Nenhuma aposta registrada no concurso ' + c + '.</b>Use “Registrar como jogado” na aba Semana ou na Banca.</div>'; ligaConf(el); return; }
  var k = confere(vols, Rz, parte), P = probsDe(c), U = uniao(vols);
  var premioTxt, lucroTxt = '—', lucroCls = '';
  if (!Rz.final) premioTxt = Rz.fim ? 'sai na apuração da Caixa' : 'depois do último jogo';
  else if (!Rz.rateio) premioTxt = 'aguardando o rateio da Caixa';
  else premioTxt = k.premio > 0 ? brl2(k.premio) : 'sem prêmio';
  if (Rz.final && Rz.rateio && ap.length) { var l = (k.premio || 0) - custo; lucroTxt = sinal(l); lucroCls = l >= 0 ? 'pos' : 'neg'; }
  h += '<div class="placar"><div class="grande"><div class="n">' + k.melhor + '<small>pontos</small></div><div class="rot">' + esc(rotulo) + '<br>' +
    (Rz.final ? 'Melhor volante, resultado final' : Rz.fim ? 'Melhor volante, todos os jogos encerrados' : 'Melhor volante até agora, ' + k.conhecidos + ' de 14 jogos com placar' + (k.maxPos > k.melhor ? '. Ainda pode chegar a ' + k.maxPos : '')) + '</div></div>' +
    '<div class="lado"><div class="item"><span>Volantes</span><b>' + vols.length + '</b><em>' + (ap.length ? brl(custo) + ' investidos' : 'não jogado') + '</em></div>' +
    '<div class="item"><span>Com 13 ou 14</span><b>' + volantesCom(k.dist, 13) + '</b><em>' + (Rz.final ? pl(k.n14, 'aposta de 14', 'apostas de 14') + ', ' + pl(k.n13, 'de 13', 'de 13') : Rz.fim ? 'pelo placar final' : 'até agora') + '</em></div>' +
    '<div class="item"><span>Prêmio</span><b>' + (k.premio > 0 ? brl(k.premio) : '—') + '</b><em>' + premioTxt + '</em></div>' +
    '<div class="item"><span>Lucro do concurso</span><b class="' + lucroCls + '">' + lucroTxt + '</b><em>' + (Rz.rateio ? (Rz.rateio.acumulou ? 'acumulou: ninguém fez 14' : Rz.rateio.g14 + ' ganhadores de 14 no Brasil') : '') + '</em></div></div></div>';
  if (Rz.final && Rz.rateio && Rz.rateio.acumulou && k.n14) h += '<div class="nota">Ninguém mais fez 14 e você fez: o prêmio é o valor acumulado. Confira na Caixa.</div>';
  // o que aprendemos
  var lic = [];
  Rz.res.forEach(function (r, i) {
    if (r == null || k.cobertura[i] > 0) return;
    var p = P ? P[i][R.indexOf(r)] : null, tipo = r === 'X' ? 'empate' : (r === '1' ? 'vitória do mandante' : 'vitória do visitante');
    var porque = p == null ? '' : (p < .2 ? ' — zebra grande: o motor dava só ' + pc(p, 0) : p < .33 ? ' — zebra: o motor dava ' + pc(p, 0) : ' — resultado com ' + pc(p, 0) + ' de chance que ficou de fora');
    lic.push('<li><b>Jogo ' + (i + 1) + ', ' + nomeT(Rz.jogos[i].m) + ' × ' + nomeT(Rz.jogos[i].v) + ':</b> ' + tipo + porque + '.</li>');
  });
  var emp = Rz.res.filter(function (r, i) { return r === 'X' && k.cobertura[i] === 0; }).length;
  if (lic.length) h += '<div class="card"><h2>' + (Rz.final || Rz.fim ? 'Onde a aposta ficou de fora' : 'Fora da aposta até agora') + '</h2><ul class="aprende">' + lic.join('') + '</ul>' +
    (emp && lic.length ? '<p class="sub" style="margin-bottom:0">' + emp + ' de ' + lic.length + ' foram empate. No histórico, 60% dos secos errados foram empate.</p>' : '') + '</div>';
  else if (k.conhecidos) h += '<div class="nota inf">Todos os resultados até agora estão cobertos por pelo menos um volante.</div>';
  // jogo a jogo
  h += '<div class="card"><h2>Jogo a jogo</h2><div class="rolagem"><table class="jogos"><tbody>' + Rz.jogos.map(function (j, i) {
    var r = Rz.res[i], cv = k.cobertura[i], st = r == null ? '<span class="st ag">' + esc(j.sit || 'aguardando') + '</span>' : cv > 0 ? '<span class="st ok">✓ em ' + cv + ' de ' + vols.length + '</span>' : '<span class="st no">✗ fora</span>';
    var sit = j.sit && j.sit.indexOf('ao vivo') === 0 ? '<small class="ao">' + esc(j.sit) + '</small>' : '';
    return '<tr><td class="n">' + (i + 1) + '</td><td class="t">' + nomeT(j.m) + ' × ' + nomeT(j.v) + sit + '</td><td class="num" style="font-weight:600;white-space:nowrap">' + (j.placar && j.placar[0] != null ? j.placar.join(' × ') : '—') + '</td>' +
      '<td>' + mk(U[i], r) + '</td><td style="text-align:right">' + st + '</td></tr>';
  }).join('') + '</tbody></table></div><p class="sub" style="margin-bottom:0">Marcas escuras: o que a aposta cobre, somando todos os volantes. Em verde, o resultado coberto; com contorno vermelho, o resultado que ficou de fora.</p></div>';
  el.innerHTML = h; ligaConf(el);
}
function volantesCom(dist, n) { var t = 0; Object.keys(dist).forEach(function (a) { if (Number(a) >= n) t += dist[a]; }); return t; }
function horaBR(u) { var t = Date.parse(String(u || '').replace('Z', ':00Z')); return isNaN(t) ? esc(u || '') : new Date(t).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }); }
function ligaConf(el) { var s = el.querySelector('#confsel'); if (s) s.onchange = function () { CONF.c = Number(s.value); pagConferencia(); }; }

// ---------------------------------------------------------------- BANCA
function linhasBanca() {
  return BANCA.lista.slice().sort(function (a, b) { return a.concurso - b.concurso || String(a.registrado_utc).localeCompare(String(b.registrado_utc)); }).map(function (a) {
    var Rz = resultadoDe(a.concurso), parte = a.minhas / a.total, k = Rz ? confere(a.vols, Rz, parte) : null;
    return { a: a, parte: parte, gasto: a.custo * parte, k: k, final: !!(Rz && Rz.final), rateio: !!(Rz && Rz.rateio) };
  });
}
function pagBanca() {
  var el = document.getElementById('p-banca'), L = linhasBanca(), h = '';
  if (!BANCA.servidor) h += '<div class="nota er"><b>A banca está guardada só neste aparelho.</b> Para aparecer igual no celular e no computador, falta configurar a chave de gravação no Render (variável <code>PAINEL_GITHUB_ESCRITA</code>). ' + (BANCA.erro && BANCA.erro !== 'sem_chave' ? 'Detalhe: ' + esc(BANCA.erro) + '.' : '') + '</div>';
  var antigas = BANCA.servidor ? antigasLocais() : [];
  if (antigas.length) h += '<div class="pendente"><span>' + (antigas.length === 1 ? 'Há 1 aposta guardada' : 'Há ' + antigas.length + ' apostas guardadas') + ' só neste aparelho.</span><button class="btn pri" id="bkimp">Levar para a banca</button></div>';
  L.filter(function (x) { return x.a.status === 'carrinho'; }).forEach(function (x) {
    h += '<div class="pendente"><span>Concurso <b>' + x.a.concurso + '</b>: ' + pl(x.a.vols.length, 'volante', 'volantes') + ', ' + brl(x.a.custo) + ' foram para o carrinho. Você pagou?</span><span class="acoes"><button class="btn pri" data-st="pago" data-id="' + x.a.id + '">Paguei</button><button class="btn" data-st="cancelado" data-id="' + x.a.id + '">Não paguei</button></span></div>';
  });
  var pagas = L.filter(function (x) { return x.a.status === 'pago'; });
  var inv = 0, rec = 0, pend = 0, serie = [], acum = 0, porConc = {};
  pagas.forEach(function (x) { inv += x.gasto; if (x.k && x.final && x.rateio) rec += x.k.premio || 0; else pend++;
    var c = x.a.concurso; porConc[c] = (porConc[c] || 0) + ((x.k && x.final && x.rateio ? x.k.premio || 0 : 0) - x.gasto); });
  Object.keys(porConc).map(Number).sort(function (a, b) { return a - b; }).forEach(function (c) { acum += porConc[c]; serie.push({ c: c, v: Math.round(acum) }); });
  var saldo = rec - inv, melhor = pagas.reduce(function (m, x) { return x.k && x.k.melhor > m ? x.k.melhor : m; }, 0);
  if (!pagas.length && !L.length) {
    el.innerHTML = h + '<div class="card vazio"><b>Nenhuma aposta registrada ainda.</b>Quando você mandar volantes para a Caixa pelo Marcador, eles entram aqui sozinhos. Também dá para <a href="#" id="bkman">registrar à mão</a>.</div>';
    ligaBanca(el); return;
  }
  h += '<div class="placar"><div class="grande"><div class="n ' + (saldo >= 0 ? 'pos' : 'neg') + '">' + (saldo > 0 ? '+' : saldo < 0 ? '−' : '') + '<span class="moeda">R$</span>' + Math.round(Math.abs(saldo)).toLocaleString('pt-BR') + '</div><div class="rot">Saldo desde a primeira aposta registrada' + (pend ? '<br>' + pl(pend, 'aposta aguardando', 'apostas aguardando') + ' resultado ou rateio' : '') + '</div></div>' +
    '<div class="lado"><div class="item"><span>Investido</span><b>' + brl(inv) + '</b><em>' + pl(pagas.length, 'aposta paga', 'apostas pagas') + '</em></div>' +
    '<div class="item"><span>Recebido</span><b>' + brl(rec) + '</b><em>prêmios conferidos com o rateio</em></div>' +
    '<div class="item"><span>Retorno</span><b>' + (inv ? pc(rec / inv, 0) : '—') + '</b><em>a média da Loteca fica perto de 25%</em></div>' +
    '<div class="item"><span>Melhor resultado</span><b>' + (melhor || '—') + '</b><em>pontos em um volante</em></div></div></div>';
  if (serie.length > 1) h += '<div class="card"><h2>Evolução do saldo</h2><div class="graf"><canvas id="gbanca"></canvas></div></div>';
  h += '<div class="card"><div class="linha-sel" style="justify-content:space-between;margin-bottom:8px"><h2 style="margin:0">Apostas</h2><button class="btn" id="bkman">Registrar aposta à mão</button></div><div class="rolagem"><table class="tbl-m"><thead><tr><th>Concurso</th><th>Aposta</th><th>Valor</th><th>Pontos</th><th>Prêmio</th><th>Saldo</th><th>Situação</th><th></th></tr></thead><tbody>' +
    L.slice().reverse().map(function (x) {
      var a = x.a, k = x.k, pr = k && x.final && x.rateio ? k.premio || 0 : null, sl = pr == null || a.status !== 'pago' ? null : pr - x.gasto;
      var pts = !k ? '<span class="st ag">aguardando</span>' : (x.final ? k.melhor : k.melhor + ' <span class="sub">(parcial)</span>');
      return '<tr><td class="num" data-l="Concurso"><a href="#" data-conf="' + a.concurso + '">' + a.concurso + '</a></td><td data-l="Aposta">' + esc(a.origem || 'Aposta') + '<br><span class="sub">' + pl(a.vols.length, 'volante', 'volantes') + (a.total > 1 ? ', ' + a.minhas + ' de ' + a.total + ' cotas' : '') + '</span></td>' +
        '<td class="num" data-l="Valor">' + brl(x.gasto) + '</td><td class="num" data-l="Pontos">' + pts + '</td><td class="num" data-l="Prêmio">' + (pr == null ? (x.final ? '<span class="sub">rateio pendente</span>' : '—') : brl2(pr)) + '</td>' +
        '<td data-l="Saldo" class="num ' + (sl == null ? '' : sl >= 0 ? 'pos' : 'neg') + '">' + (sl == null ? '—' : sinal(sl)) + '</td>' +
        '<td data-l="Situação"><select class="sel" data-id="' + a.id + '" style="min-height:36px;padding:4px 8px">' + [['pago', 'Paga'], ['carrinho', 'No carrinho'], ['cancelado', 'Não paga']].map(function (o) { return '<option value="' + o[0] + '"' + (a.status === o[0] ? ' selected' : '') + '>' + o[1] + '</option>'; }).join('') + '</select></td>' +
        '<td><button class="btn" data-del="' + a.id + '" title="Apagar" aria-label="Apagar aposta" style="min-height:36px;padding:4px 10px">Apagar</button></td></tr>';
    }).join('') + '</tbody></table></div></div>';
  el.innerHTML = h; ligaBanca(el);
  if (serie.length > 1 && window.Chart) grafico('gbanca', { type: 'line', data: { labels: serie.map(function (s) { return s.c; }), datasets: [{ data: serie.map(function (s) { return s.v; }), borderColor: '#16202A', backgroundColor: 'rgba(30,91,72,.08)', fill: true, tension: .2, pointRadius: 3 }] },
    options: { maintainAspectRatio: false, plugins: { legend: { display: false }, tooltip: { callbacks: { label: function (t) { return 'Saldo ' + brl(t.parsed.y); } } } }, scales: { y: { ticks: { callback: function (v) { return brl(v); } } } } } });
}
function ligaBanca(el) {
  el.querySelectorAll('[data-st]').forEach(function (b) { b.onclick = function () { bancaAcao({ acao: 'status', id: b.dataset.id, status: b.dataset.st }); }; });
  el.querySelectorAll('select[data-id]').forEach(function (s) { s.onchange = function () { bancaAcao({ acao: 'status', id: s.dataset.id, status: s.value }); }; });
  el.querySelectorAll('[data-del]').forEach(function (b) { b.onclick = function () { if (confirm('Apagar esta aposta da banca?')) bancaAcao({ acao: 'apagar', id: b.dataset.del }); }; });
  el.querySelectorAll('[data-conf]').forEach(function (a) { a.onclick = function (e) { e.preventDefault(); CONF.c = Number(a.dataset.conf); irPara('p-conf'); }; });
  var m = el.querySelector('#bkman'); if (m) m.onclick = function (e) { e.preventDefault(); bancaRegistrar({}); };
  var imp = el.querySelector('#bkimp'); if (imp) imp.onclick = function () {
    bancaAcao({ acao: 'importar', apostas: antigasLocais() }).then(function (j) { if (j && j.ok) { try { localStorage.removeItem('loteca_banca'); localStorage.removeItem('loteca_jogadas'); } catch (e) {} pagBanca(); } });
  };
}
document.addEventListener('click', function (e) { var a = e.target.closest && e.target.closest('[data-ir]'); if (!a) return; e.preventDefault(); irPara(a.dataset.ir, a.dataset.sub); });
setInterval(function () { carregaResultados().then(function () { if (D && !document.getElementById('p-conf').hidden) pagConferencia(); }); }, 300000);
</script>
