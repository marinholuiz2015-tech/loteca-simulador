<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loteca Elite Pro — Copa 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #060a0f;
  --bg2: #0c1219;
  --bg3: #111a24;
  --verde: #00ff87;
  --verde2: #00cc6a;
  --amarelo: #ffd60a;
  --vermelho: #ff4757;
  --azul: #00b4d8;
  --texto: #e8f4f8;
  --muted: #4a6278;
  --borda: rgba(0,255,135,0.12);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--texto);
  min-height: 100vh;
}
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse 80% 40% at 50% -10%, rgba(0,255,135,0.07) 0%, transparent 60%),
    radial-gradient(ellipse 60% 30% at 100% 100%, rgba(0,180,216,0.05) 0%, transparent 50%);
  pointer-events: none;
  z-index: 0;
}

/* HEADER */
header {
  position: relative;
  z-index: 1;
  padding: 32px 40px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--borda);
}
.logo {
  display: flex;
  align-items: baseline;
  gap: 12px;
}
.logo-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 2.4rem;
  letter-spacing: 0.04em;
  color: var(--verde);
  line-height: 1;
}
.logo-sub {
  font-size: 0.7rem;
  color: var(--muted);
  letter-spacing: 0.15em;
  text-transform: uppercase;
}
.header-badge {
  display: flex;
  align-items: center;
  gap: 8px;
  background: rgba(255,214,10,0.08);
  border: 1px solid rgba(255,214,10,0.25);
  border-radius: 6px;
  padding: 8px 16px;
  font-size: 0.75rem;
  color: var(--amarelo);
  font-family: 'DM Mono', monospace;
  letter-spacing: 0.05em;
}
.dot-live {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--amarelo);
  animation: pulse 1.5s infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.5; transform: scale(0.8); }
}

/* MAIN */
main {
  position: relative;
  z-index: 1;
  max-width: 1200px;
  margin: 0 auto;
  padding: 32px 24px;
}

/* CONCURSO HEADER */
.concurso-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 16px;
  margin-bottom: 32px;
  padding: 24px 28px;
  background: var(--bg2);
  border: 1px solid var(--borda);
  border-radius: 12px;
}
.concurso-num {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 3.5rem;
  color: var(--verde);
  line-height: 1;
}
.concurso-info { flex: 1; padding-left: 20px; }
.concurso-nome {
  font-size: 1.1rem;
  font-weight: 600;
  color: var(--texto);
  margin-bottom: 4px;
}
.concurso-periodo {
  font-size: 0.8rem;
  color: var(--muted);
  font-family: 'DM Mono', monospace;
}
.concurso-tabs {
  display: flex;
  gap: 6px;
}
.tab-btn {
  font-family: 'DM Mono', monospace;
  font-size: 0.72rem;
  padding: 7px 14px;
  border-radius: 6px;
  border: 1px solid var(--borda);
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  transition: all 0.2s;
  letter-spacing: 0.05em;
}
.tab-btn:hover, .tab-btn.ativo {
  border-color: var(--verde);
  color: var(--verde);
  background: rgba(0,255,135,0.06);
}

/* PAINEIS */
.paineis-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
  margin-bottom: 32px;
}
@media(max-width: 700px) { .paineis-grid { grid-template-columns: 1fr; } }
.painel-card {
  border-radius: 12px;
  padding: 22px;
  border: 1px solid;
  position: relative;
  overflow: hidden;
}
.painel-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
}
.painel-eco { border-color: rgba(0,255,135,0.2); background: rgba(0,255,135,0.03); }
.painel-eco::before { background: var(--verde); }
.painel-rec { border-color: rgba(0,180,216,0.2); background: rgba(0,180,216,0.03); }
.painel-rec::before { background: var(--azul); }
.painel-elite { border-color: rgba(255,214,10,0.2); background: rgba(255,214,10,0.03); }
.painel-elite::before { background: var(--amarelo); }

.painel-titulo {
  font-size: 0.65rem;
  font-weight: 600;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  margin-bottom: 16px;
}
.painel-eco .painel-titulo { color: var(--verde); }
.painel-rec .painel-titulo { color: var(--azul); }
.painel-elite .painel-titulo { color: var(--amarelo); }

.painel-custo {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 2.2rem;
  line-height: 1;
  margin-bottom: 14px;
}
.painel-eco .painel-custo { color: var(--verde); }
.painel-rec .painel-custo { color: var(--azul); }
.painel-elite .painel-custo { color: var(--amarelo); }

.painel-prob {
  display: flex;
  justify-content: space-between;
  font-size: 0.72rem;
  color: var(--muted);
  margin-bottom: 6px;
  font-family: 'DM Mono', monospace;
}
.painel-prob span:last-child { color: var(--texto); font-weight: 500; }
.btn-gerar {
  width: 100%;
  margin-top: 16px;
  padding: 10px;
  border-radius: 7px;
  border: none;
  font-family: 'DM Sans', sans-serif;
  font-size: 0.8rem;
  font-weight: 600;
  cursor: pointer;
  letter-spacing: 0.03em;
  transition: opacity 0.2s;
}
.btn-gerar:hover { opacity: 0.85; }
.painel-eco .btn-gerar { background: var(--verde); color: #000; }
.painel-rec .btn-gerar { background: var(--azul); color: #000; }
.painel-elite .btn-gerar { background: var(--amarelo); color: #000; }

/* JOGOS */
.jogos-titulo {
  font-size: 0.65rem;
  font-weight: 600;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.jogos-titulo::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--borda);
}
.jogos-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  gap: 10px;
}
.jogo-card {
  background: var(--bg2);
  border: 1px solid var(--borda);
  border-radius: 10px;
  padding: 16px 18px;
  display: flex;
  align-items: center;
  gap: 14px;
  transition: border-color 0.2s;
}
.jogo-card:hover { border-color: rgba(0,255,135,0.3); }
.jogo-num {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.6rem;
  color: var(--muted);
  min-width: 28px;
  line-height: 1;
}
.jogo-times { flex: 1; }
.jogo-mandante {
  font-size: 0.88rem;
  font-weight: 600;
  color: var(--texto);
  margin-bottom: 2px;
}
.jogo-vs {
  font-size: 0.65rem;
  color: var(--muted);
  margin-bottom: 2px;
}
.jogo-visitante {
  font-size: 0.8rem;
  color: var(--muted);
}
.jogo-data {
  font-family: 'DM Mono', monospace;
  font-size: 0.65rem;
  color: var(--muted);
  text-align: right;
  min-width: 50px;
}
.jogo-badge {
  font-size: 0.62rem;
  font-weight: 700;
  padding: 4px 10px;
  border-radius: 4px;
  letter-spacing: 0.08em;
  min-width: 60px;
  text-align: center;
}
.badge-seco { background: rgba(0,255,135,0.12); color: var(--verde); border: 1px solid rgba(0,255,135,0.25); }
.badge-duplo { background: rgba(0,180,216,0.12); color: var(--azul); border: 1px solid rgba(0,180,216,0.25); }
.badge-triplo { background: rgba(255,71,87,0.12); color: var(--vermelho); border: 1px solid rgba(255,71,87,0.25); }

/* LOADING */
.loading {
  text-align: center;
  padding: 60px 20px;
  color: var(--muted);
  font-family: 'DM Mono', monospace;
  font-size: 0.85rem;
}
.spinner {
  width: 32px; height: 32px;
  border: 2px solid var(--borda);
  border-top-color: var(--verde);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin: 0 auto 16px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ERRO */
.erro {
  text-align: center;
  padding: 40px;
  color: var(--vermelho);
  font-size: 0.85rem;
  background: rgba(255,71,87,0.05);
  border: 1px solid rgba(255,71,87,0.15);
  border-radius: 10px;
}

footer {
  position: relative;
  z-index: 1;
  text-align: center;
  padding: 24px;
  color: var(--muted);
  font-size: 0.65rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  border-top: 1px solid var(--borda);
}
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-title">Loteca Elite Pro</div>
    <div class="logo-sub">Copa do Mundo 2026</div>
  </div>
  <div class="header-badge">
    <div class="dot-live"></div>
    <span id="header-status">Carregando...</span>
  </div>
</header>

<main>
  <div class="concurso-header">
    <div class="concurso-num" id="num-concurso">—</div>
    <div class="concurso-info">
      <div class="concurso-nome" id="nome-concurso">Carregando concurso...</div>
      <div class="concurso-periodo" id="periodo-concurso">—</div>
    </div>
    <div class="concurso-tabs">
      <button class="tab-btn ativo" onclick="carregarConcurso(1255)">1255</button>
      <button class="tab-btn" onclick="carregarConcurso(1256)">1256</button>
      <button class="tab-btn" onclick="carregarConcurso(1257)">1257</button>
      <button class="tab-btn" onclick="carregarConcurso(1258)">1258</button>
    </div>
  </div>

  <div class="paineis-grid">
    <div class="painel-card painel-eco">
      <div class="painel-titulo">Econômica</div>
      <div class="painel-custo" id="custo-eco">R$ —</div>
      <div class="painel-prob"><span>13 pontos</span><span id="p13-eco">—</span></div>
      <div class="painel-prob"><span>14 pontos</span><span id="p14-eco">—</span></div>
      <button class="btn-gerar">Gerar Grade</button>
    </div>
    <div class="painel-card painel-rec">
      <div class="painel-titulo">Recomendada</div>
      <div class="painel-custo" id="custo-rec">R$ —</div>
      <div class="painel-prob"><span>13 pontos</span><span id="p13-rec">—</span></div>
      <div class="painel-prob"><span>14 pontos</span><span id="p14-rec">—</span></div>
      <button class="btn-gerar">Gerar Grade</button>
    </div>
    <div class="painel-card painel-elite">
      <div class="painel-titulo">Elite Pro</div>
      <div class="painel-custo" id="custo-elite">R$ —</div>
      <div class="painel-prob"><span>13 pontos</span><span id="p13-elite">—</span></div>
      <div class="painel-prob"><span>14 pontos</span><span id="p14-elite">—</span></div>
      <button class="btn-gerar">Gerar Grade</button>
    </div>
  </div>

  <div class="jogos-titulo">14 Jogos do Concurso</div>
  <div id="jogos-container">
    <div class="loading">
      <div class="spinner"></div>
      Conectando ao sistema...
    </div>
  </div>
</main>

<footer>Loteca Elite Pro &nbsp;·&nbsp; Sistema privado &nbsp;·&nbsp; Copa do Mundo 2026</footer>

<script>
async function carregarConcurso(num) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('ativo'));
  document.querySelectorAll('.tab-btn').forEach(b => {
    if(b.textContent.trim() === String(num)) b.classList.add('ativo');
  });

  document.getElementById('jogos-container').innerHTML = '<div class="loading"><div class="spinner"></div>Carregando jogos...</div>';

  try {
    const url = num === 1255
      ? '/api/grade-automatica'
      : `/api/concurso/${num}`;
    const res = await fetch(url);
    const d = await res.json();

    if(d.status !== 'sucesso') throw new Error('API retornou erro');

    document.getElementById('num-concurso').textContent = d.concurso;
    document.getElementById('nome-concurso').textContent = d.nome;
    document.getElementById('periodo-concurso').textContent = d.periodo;
    document.getElementById('header-status').textContent = `Concurso ${d.concurso} · ${d.total_jogos} jogos`;

    const p = d.paineis_decisao;
    const eco = p.opcao_economica_ate_100;
    const rec = p.opcao_recomendada;
    const eli = p.opcao_elite_pro_alta_assertividade;

    document.getElementById('custo-eco').textContent = `R$ ${eco.custo_real_estimado.toFixed(2)}`;
    document.getElementById('p13-eco').textContent = eco.probabilidade_13_pontos;
    document.getElementById('p14-eco').textContent = eco.probabilidade_14_pontos;

    document.getElementById('custo-rec').textContent = `R$ ${rec.custo_real_estimado.toFixed(2)}`;
    document.getElementById('p13-rec').textContent = rec.probabilidade_13_pontos;
    document.getElementById('p14-rec').textContent = rec.probabilidade_14_pontos;

    document.getElementById('custo-elite').textContent = `R$ ${eli.custo_real_estimado.toFixed(2)}`;
    document.getElementById('p13-elite').textContent = eli.probabilidade_13_pontos;
    document.getElementById('p14-elite').textContent = eli.probabilidade_14_pontos;

    const html = d.jogos.map(j => {
      const tipo = j.classificacao.tipo;
      const badgeClass = tipo === 'SECO' ? 'badge-seco' : tipo === 'DUPLO' ? 'badge-duplo' : 'badge-triplo';
      return `
        <div class="jogo-card">
          <div class="jogo-num">${j.id}</div>
          <div class="jogo-times">
            <div class="jogo-mandante">${j.mandante}</div>
            <div class="jogo-vs">vs</div>
            <div class="jogo-visitante">${j.visitante}</div>
          </div>
          <div class="jogo-data">${j.data}<br>${j.hora}</div>
          <div class="jogo-badge ${badgeClass}">${tipo}<br>${j.classificacao.coluna_recomendada}</div>
        </div>`;
    }).join('');

    document.getElementById('jogos-container').innerHTML = `<div class="jogos-grid">${html}</div>`;

  } catch(e) {
    document.getElementById('header-status').textContent = 'Erro ao carregar';
    document.getElementById('jogos-container').innerHTML = `<div class="erro">Erro ao conectar com a API.<br>Tente recarregar a página.</div>`;
  }
}

window.onload = () => carregarConcurso(1255);
</script>
</body>
</html>
