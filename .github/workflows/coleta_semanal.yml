name: Coleta semanal de fontes (Lotequeiros, Guia da Loteria, Arena, Vovoteca, resultados)

# Roda no GitHub Actions, nao no Render.
#   - quinta 19:23 (Brasilia): primeiro retrato da semana
#   - sabado 10:17 (Brasilia): retrato perto do fechamento das 15h
#   - terca 00:41 (segunda 21:41 Brasilia): resultados oficiais e assertividade
# Tambem pode ser disparado na mao: aba Actions > este workflow > Run workflow.
# Cada passo continua mesmo se outro falhar; o job fica vermelho no final
# se algum passo falhou, para a falha nunca passar despercebida.
on:
  schedule:
    - cron: "23 22 * * 4"
    - cron: "17 13 * * 6"
    - cron: "41 0 * * 2"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: coleta-semanal
  cancel-in-progress: false

jobs:
  coleta:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr
          pip install requests numpy opencv-python-headless pytesseract

      - name: Guia da Loteria (odds de mercado + palpite)
        id: guia
        continue-on-error: true
        run: python coleta/guia_loteria.py

      - name: Lotequeiros (palpites novos)
        id: lotequeiros
        continue-on-error: true
        run: python coleta/coletar_lotequeiros.py semanal

      - name: Resultados oficiais da Caixa
        id: caixa
        continue-on-error: true
        run: python coleta/resultados_caixa.py

      - name: Assertividade do Lotequeiros
        id: avaliar
        continue-on-error: true
        run: python coleta/avaliar_lotequeiros.py | tee coleta/dados/resumo_lotequeiros.txt

      - name: Arena do AZ (odds bet365, leitura da imagem)
        id: arena
        continue-on-error: true
        run: python -W ignore coleta/ocr/arena_semanal.py | tee coleta/dados/resumo_arena.txt

      - name: Vovoteca (enquete final, efeito manada)
        id: vovoteca
        continue-on-error: true
        run: python -W ignore coleta/vovoteca_enquete.py semanal

      - name: Vovoteca (parcial do concurso aberto, antes do fechamento)
        id: vovoteca_aberto
        continue-on-error: true
        run: python -W ignore coleta/vovoteca_enquete.py aberto

      - name: Massa x mercado
        id: massa
        continue-on-error: true
        run: python coleta/avaliar_massa.py | tee coleta/dados/resumo_massa.txt

      - name: Gravar dados no repositorio
        run: |
          git config user.name "loteca-coleta-bot"
          git config user.email "actions@github.com"
          git add coleta/dados/*.csv coleta/dados/*.txt coleta/ocr/arena_ocr.jsonl || true
          git diff --cached --quiet && exit 0
          git commit -m "Coleta semanal de fontes (automatico)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 10
          done
          exit 1

      - name: Marcar falha se algum passo falhou
        if: steps.guia.outcome == 'failure' || steps.lotequeiros.outcome == 'failure' || steps.caixa.outcome == 'failure' || steps.avaliar.outcome == 'failure' || steps.arena.outcome == 'failure' || steps.vovoteca.outcome == 'failure' || steps.vovoteca_aberto.outcome == 'failure' || steps.massa.outcome == 'failure'
        run: |
          echo "guia=${{ steps.guia.outcome }} lotequeiros=${{ steps.lotequeiros.outcome }} caixa=${{ steps.caixa.outcome }} avaliar=${{ steps.avaliar.outcome }}"
          echo "arena=${{ steps.arena.outcome }} vovoteca=${{ steps.vovoteca.outcome }} aberto=${{ steps.vovoteca_aberto.outcome }} massa=${{ steps.massa.outcome }}"
          exit 1
