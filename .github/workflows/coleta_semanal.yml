name: Coleta semanal de fontes (Lotequeiros, Guia da Loteria, Arena, Vovoteca, resultados)

# Roda no GitHub Actions, nao no Render. Horarios de Brasilia:
#   - terca 09:17: previsao PROVISORIA (cotacoes da semana ja publicadas)
#   - quinta 09:47: previsao OFICIAL (depois da atualizacao das 7h da Arena,
#     a tempo dos especialistas e dos bolões)
#   - quinta 19:23: oficial atualizada + parcial da enquete da massa
#   - sabado 10:17: ATUALIZACAO (medida a parte: esperar melhora o acerto?)
#   - segunda 21:41: resultados oficiais, assertividade, placar e novo teste da camada sentinela
# A camada sentinela (desfalques, descanso, forma, clima da FotMob/Open-Meteo) coleta os fatos
# do concurso aberto antes de cada previsao e so mexe nas probabilidades se o teste no tempo
# mostrar que ela acerta mais que o mercado (motor/sentinela_modelo.json, refeito toda semana).
# Tambem pode ser disparado na mao: aba Actions > este workflow > Run workflow.
# Cada passo continua mesmo se outro falhar; o job fica vermelho no final
# se algum passo falhou, para a falha nunca passar despercebida.
on:
  schedule:
    - cron: "17 12 * * 2"
    - cron: "47 12 * * 4"
    - cron: "23 22 * * 4"
    - cron: "17 13 * * 6"
    - cron: "41 0 * * 2"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: coleta-semanal
  cancel-in-progress: false

jobs:
  coleta:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr
          pip install requests numpy opencv-python-headless pytesseract pillow scipy

      - name: Guia da Loteria (odds de mercado + palpite)
        id: guia
        continue-on-error: true
        run: python coleta/guia_loteria.py

      - name: Lotequeiros (palpites novos)
        id: lotequeiros
        continue-on-error: true
        run: python coleta/coletar_lotequeiros.py semanal

      - name: Resultados oficiais da Caixa
        id: caixa
        continue-on-error: true
        run: python coleta/resultados_caixa.py

      - name: Assertividade do Lotequeiros
        id: avaliar
        continue-on-error: true
        run: python coleta/avaliar_lotequeiros.py | tee coleta/dados/resumo_lotequeiros.txt

      - name: Arena do AZ (odds bet365, leitura da imagem)
        id: arena
        continue-on-error: true
        run: python -W ignore coleta/ocr/arena_semanal.py | tee coleta/dados/resumo_arena.txt

      - name: Vovoteca (enquete final, efeito manada)
        id: vovoteca
        continue-on-error: true
        run: python -W ignore coleta/vovoteca_enquete.py semanal

      - name: Vovoteca (parcial do concurso aberto, antes do fechamento)
        id: vovoteca_aberto
        continue-on-error: true
        run: python -W ignore coleta/vovoteca_enquete.py aberto

      - name: Massa x mercado
        id: massa
        continue-on-error: true
        run: python coleta/avaliar_massa.py | tee coleta/dados/resumo_massa.txt

      - name: Chance de Gol (modelo independente das odds) e teste contra a bet365
        id: chancedegol
        continue-on-error: true
        run: |
          python coleta/chancedegol.py
          python motor/chancedegol_teste.py

      - name: FootyStats (Premier League gratis - odds, xG e xG previsto)
        id: footystats
        continue-on-error: true
        run: python coleta/footystats.py

      - name: Jogos prontos e boloes dos sites (Arena, Vovoteca) e confronto com o nosso
        id: sites
        continue-on-error: true
        timeout-minutes: 10
        run: |
          timeout 150 python -W ignore coleta/ocr/arena_palpites.py semanal || echo "arena palpites: falhou nesta rodada"
          timeout 150 python -W ignore coleta/ocr/vovo_matriz.py semanal || echo "vovo matriz: falhou nesta rodada"
          timeout 150 python -W ignore coleta/ocr/vovo_boloes.py semanal || echo "vovo boloes: falhou nesta rodada"
          timeout 120 python motor/confronto_sites.py > motor/confronto_sites.md || echo "confronto: falhou nesta rodada"

      - name: Tabela ao vivo (football-data) para os alertas de motivacao
        id: tabela
        continue-on-error: true
        timeout-minutes: 4
        run: |
          timeout 180 python coleta/futebol_data.py semanal || echo "football-data falhou nesta rodada"

      - name: Sentinela - fatos do concurso aberto (desfalques, descanso, forma, clima)
        id: sentinela
        continue-on-error: true
        timeout-minutes: 12
        run: |
          timeout 400 python coleta/sentinela/coletar_sentinela.py aberto || echo "sentinela: parou no limite de tempo"
          timeout 300 python coleta/sentinela/noticias.py || echo "noticias: parou no limite de tempo"

      - name: The Odds API - terceira fonte de odds (reserva da Arena e do Guia)
        id: odds_api
        continue-on-error: true
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python coleta/odds_api.py

      - name: Motor - camada 1 (previsao do concurso aberto - provisoria/oficial/atualizacao)
        id: motor
        continue-on-error: true
        run: python motor/camada1.py

      - name: Camada 2 - jogo por valor (rateio)
        id: camada2
        continue-on-error: true
        timeout-minutes: 26
        run: |
          timeout 420 python motor/camada2.py || echo "camada 2 sem dados suficientes nesta rodada"
          timeout 300 python motor/camada3.py || echo "camada 3 sem dados suficientes nesta rodada"
          timeout 240 python motor/desdobre.py || echo "desdobre sem dados nesta rodada"
          timeout 300 python motor/pilares.py --aberto || echo "pilares do concurso aberto: sem dados nesta rodada"
          timeout 420 python motor/painel_dados.py || echo "painel sem atualizacao nesta rodada"
          timeout 120 python coleta/ao_vivo.py --forcar || echo "placar indisponivel"

      - name: Motor - placar ao vivo
        id: placar
        continue-on-error: true
        run: python motor/placar.py

      - name: KPIs - fatos dos jogos encerrados e novo placar de KPIs (pesos reaprendidos; liga so se superar o mercado)
        id: sentinela_treino
        # so na rodada de segunda (resultados) ou na mao; tempo limitado para nunca travar o resto
        if: github.event.schedule == '41 0 * * 2' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        timeout-minutes: 28
        run: |
          timeout 420 python coleta/sentinela/coletar_sentinela.py historico || echo "historico: parou no limite de tempo (continua na proxima semana)"
          CLIMA_PRAZO=300 MAX_CLIMA=5000 timeout 360 python coleta/sentinela/coletar_sentinela.py clima || echo "clima: parou no limite de tempo"
          python motor/kpis.py medir > /dev/null && echo "placar de KPIs atualizado (motor/kpis.md)"
          python motor/varredura.py > /dev/null && echo "varredura de nuances atualizada (motor/nuances.md)"
          timeout 300 python motor/sinal_especialista.py > motor/sinal_especialista.md && echo "teste do sinal dos sites atualizado (motor/sinal_especialista.md)"
          timeout 240 python coleta/futebol_data.py historico || echo "football-data historico: incompleto"
          python motor/rodizio.py || echo "rodizio: sem ajuste nesta rodada"
          timeout 240 python motor/motivacao.py > /dev/null && echo "teste de motivacao pela tabela atualizado (motor/motivacao.md)"
          python motor/camada3.py conferir > /dev/null && echo "placar financeiro conferido (motor/placar_financeiro.md)"
          python motor/pilares.py --placar || echo "placar por pilar: sem dados"
          timeout 180 python coleta/pesquisa/fechamento.py > /dev/null && echo "odd de quinta x fechamento atualizado (motor/fechamento.md)"

      - name: Gravar dados no repositorio
        run: |
          git config user.name "loteca-coleta-bot"
          git config user.email "actions@github.com"
          git add coleta/dados/*.csv coleta/dados/*.txt coleta/ocr/arena_ocr.jsonl motor/saida motor/registro_previsoes.csv motor/placar.md motor/kpis.md motor/kpis_modelo.json motor/nuances.json motor/nuances.md motor/confronto_sites.md motor/sinal_especialista.md motor/motivacao.md motor/motivacao.json motor/fechamento.md motor/apostas motor/camada3_historico.csv motor/camada3_config.json motor/placar_financeiro.md motor/rodizio.json motor/historico_desdobre.csv motor/pilares_registro.csv motor/chancedegol_teste.md docs/dados 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "Coleta semanal de fontes (automatico)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 10
          done
          exit 1

      - name: Marcar falha se algum passo falhou
        if: steps.guia.outcome == 'failure' || steps.lotequeiros.outcome == 'failure' || steps.caixa.outcome == 'failure' || steps.avaliar.outcome == 'failure' || steps.arena.outcome == 'failure' || steps.vovoteca.outcome == 'failure' || steps.vovoteca_aberto.outcome == 'failure' || steps.massa.outcome == 'failure' || steps.motor.outcome == 'failure' || steps.placar.outcome == 'failure' || steps.sentinela.outcome == 'failure' || steps.sentinela_treino.outcome == 'failure'
        run: |
          echo "guia=${{ steps.guia.outcome }} lotequeiros=${{ steps.lotequeiros.outcome }} caixa=${{ steps.caixa.outcome }} avaliar=${{ steps.avaliar.outcome }}"
          echo "arena=${{ steps.arena.outcome }} vovoteca=${{ steps.vovoteca.outcome }} aberto=${{ steps.vovoteca_aberto.outcome }} massa=${{ steps.massa.outcome }} motor=${{ steps.motor.outcome }} placar=${{ steps.placar.outcome }} sentinela=${{ steps.sentinela.outcome }} treino=${{ steps.sentinela_treino.outcome }}"
          exit 1
