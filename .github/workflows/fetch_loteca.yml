name: Atualizar cache da Loteca (CEF)

# Roda a cada 30 min e também pode ser disparado manualmente (aba
# Actions do repo, botão "Run workflow"). Esse job busca o concurso da
# Caixa a partir da rede do GitHub Actions -- não do Render -- pra
# contornar o bloqueio 403 por IP de datacenter confirmado em produção
# (04-05/09/2026). O resultado fica em data/cef_cache.json, publicado
# via raw.githubusercontent.com pro app.py ler.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install requests

      - name: Buscar dado da Caixa
        id: fetch
        run: python scripts/fetch_loteca_cache.py
        continue-on-error: true

      - name: Commitar cache atualizado
        run: |
          git config user.name "loteca-cache-bot"
          git config user.email "actions@github.com"
          git add data/cef_cache.json
          git diff --cached --quiet || git commit -m "Atualiza cache Loteca (automatico)"
          git push

      - name: Marcar job como falho se a busca da Caixa falhou
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "A busca na Caixa falhou -- ver o passo 'Buscar dado da Caixa' acima pro status HTTP exato."
          exit 1
