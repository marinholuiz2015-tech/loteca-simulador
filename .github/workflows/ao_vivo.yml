name: Placar ao vivo (painel)

on:
  schedule:
    # janelas de jogo (horario UTC; Brasilia = UTC-3), para caber nos 2.000 min/mes do plano gratuito
    - cron: "*/15 13-23 * * 6,0"      # sabado e domingo, 10h as 21h
    - cron: "*/15 0-2 * * 0,1"        # sabado e domingo a noite, 21h a meia-noite
    - cron: "*/30 22-23 * * 2,3,4"    # concursos no meio da semana, 19h as 21h
    - cron: "*/30 0-1 * * 3,4,5"      # meio da semana, 21h as 23h
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gravar-repositorio
  cancel-in-progress: false

jobs:
  placar:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Placar dos jogos do concurso aberto
        run: |
          pip install -q requests
          timeout 180 python coleta/ao_vivo.py || echo "placar indisponivel nesta rodada"
      - name: Gravar
        run: |
          git config user.name "loteca-bot"
          git config user.email "loteca-bot@users.noreply.github.com"
          git add docs/dados/ao_vivo.json
          if git diff --cached --quiet; then echo "sem mudanca"; exit 0; fi
          git commit -m "Placar ao vivo"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
