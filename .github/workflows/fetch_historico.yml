name: Baixar historico completo da Loteca (CEF)

# Roda SO quando disparado na mao (aba Actions > este workflow > Run workflow).
# Baixa todos os concursos fechados para data/historico_cef.json.
# Fase 1 do Estudo Base Unico (21/11/2026).
on:
  workflow_dispatch:
    inputs:
      limite:
        description: "Quantos concursos baixar nesta rodada (0 = todos)"
        required: false
        default: "0"

permissions:
  contents: write

jobs:
  historico:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install requests

      - name: Baixar concursos da Caixa
        env:
          LIMITE: ${{ github.event.inputs.limite }}
        run: python scripts/fetch_historico_cef.py

      - name: Commitar historico
        if: always()
        run: |
          git config user.name "loteca-cache-bot"
          git config user.email "actions@github.com"
          git add data/historico_cef.json || true
          git diff --cached --quiet && exit 0
          git commit -m "Atualiza historico completo da Loteca (manual)"
          git pull --rebase origin main
          git push
